# Generated by scripts/lab/splunk_setup/conf.py from plan.py — do not hand-edit.
# Source of truth: docs/hunt/SPLUNK_SETUP_RUNBOOK.md, stage 1.


[linux_secure]
SHOULD_LINEMERGE = false
TRANSFORMS-ph_ix_linux_secure = ph_ix_linux_secure_user, ph_ix_linux_secure_src
EVAL-dest = host
EVAL-action = if(match(_raw, "(?i)failed|failure|invalid"), "failure", "success")
EVAL-app = case(match(_raw, "sshd"), "sshd", match(_raw, "sudo"), "sudo", true(), "pam")

[linux_audit]
SHOULD_LINEMERGE = false
TRANSFORMS-ph_ix_linux_audit = ph_ix_linux_audit_acct, ph_ix_linux_audit_exe, ph_ix_linux_audit_addr, ph_ix_linux_audit_terminal, ph_ix_linux_audit_uid
EVAL-dest = host
EVAL-action = if(match(_raw, "res=failed"), "failure", "success")
EVAL-process = comm
EVAL-process_name = comm
EVAL-process_path = exe
EVAL-process_id = pid
EVAL-parent_process_id = ppid

[access_combined]
SHOULD_LINEMERGE = false
TRANSFORMS-ph_ix_access_combined = ph_ix_access_combined_c_ip, ph_ix_access_combined_c_user, ph_ix_access_combined_vhost, ph_ix_access_combined_cs_method, ph_ix_access_combined_cs_uri_stem, ph_ix_access_combined_sc_status, ph_ix_access_combined_cs_user_agent
EVAL-src = c_ip
EVAL-user = if(c_user="-", null(), c_user)
EVAL-dest = host
EVAL-site = vhost
EVAL-http_method = cs_method
EVAL-uri_path = cs_uri_stem
EVAL-status = sc_status
EVAL-http_user_agent = cs_user_agent
EVAL-action = "allowed"

[suricata]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 65535
EVAL-src = src_ip
EVAL-dest = dest_ip
EVAL-src_port = src_port
EVAL-dest_port = dest_port
EVAL-transport = proto
EVAL-query = dns.rrname
EVAL-bytes_in = flow.bytes_toclient
EVAL-bytes_out = flow.bytes_toserver
EVAL-http_method = http.http_method
EVAL-uri_path = url
EVAL-status = http.status
EVAL-action = if(event_type="flow", if(flow.action="blocked", "blocked", "allowed"), null())

[suricata:fast]
SHOULD_LINEMERGE = false
TRANSFORMS-ph_ix_suricata_fast = ph_ix_suricata_fast_signature_id, ph_ix_suricata_fast_signature, ph_ix_suricata_fast_severity, ph_ix_suricata_fast_src, ph_ix_suricata_fast_dest

[dnsmasq]
SHOULD_LINEMERGE = false
TRANSFORMS-ph_ix_dnsmasq = ph_ix_dnsmasq_dns_query, ph_ix_dnsmasq_src
EVAL-query = dns_query
EVAL-dest = host
EVAL-vendor_product = "dnsmasq"

[metricbeat:system]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 65535
