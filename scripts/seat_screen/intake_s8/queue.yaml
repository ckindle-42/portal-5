# Screen kit for the s8 intake queue — docs/MODEL_INTAKE_FRESHNESS_20261029.md.
# Research only: nothing here is downloaded, installed, registered or seated. One bench
# at a time, replace in place, the fleet never grows. `intake_tag` is the tag to create
# at intake; until then a campaign reports the challenger MISSING, which is correct.
version: 1
source: docs/MODEL_INTAKE_FRESHNESS_20261029.md
envelope:
  host: 64 GiB M4 Pro
  router_resident_gb: 5.4
  seat_budget_gb: 50
  free_disk_gb: 466
on_intake:
  # What the quiet-window run does before the first row. Nothing here is done in this lane.
  - "pull the named GGUF repo at the named quant, then build intake_tag from it with the baked num_ctx (a -ctxNk tag is derived, never pulled)"
  - "register intake_tag in config/backends.yaml in the workspace's routed group; supports_tools comes from the probe, never from the card"
  - "add the tag to tests/wfe/candidate_queue.yaml (available: true, intended: [<workspace>]) once it is installed, so tests.wfe.sweep_plan can place it"
  - "add a kit persona/variant for probe_seat; scripts/seat_screen/kit_apply.py --dry-run is the pattern, and nothing is seeded from here"
defaults:
  # The WFE decision rule the incumbent seats were measured under. tests/unit/
  # test_seat_screen_intake_s8.py pins these numbers to tests/wfe/decision.py.
  pass_bar:
    screen:
      min_compared_tasks: 8
      drop_if_losses_exceed_wins_by: 3
      verdicts: [ADVANCE, DROP]
    confirm:
      min_compared_tasks: 30
      alpha: 0.05
      max_excluded_frac: 0.10
      verdicts: [BETTER, WORSE, NOT_SEPARATED, NO_DECISION]
