# Paste-ready variant blocks. Do not edit config/portal.yaml from this repo.
# Paste under workspaces.auto-coding.variants (coding seats) or
# workspaces.auto-spl.variants (Nano). New keys only — do not replace incumbents.
# 2026-10-21 dense MLX re-screen: kit-qwen38-27b, kit-orcarouter, kit-huihui36
# hints now name oMLX directory ids, and kit-qwen36-27b is new. Every re-screen
# hint is a raw oMLX id registered on omlx-coding, so no hint can fall through
# to an Ollama GGUF tag if an alias line is missed.
# After paste, regenerate derived routing on the live checkout. This worker did not.
# Do not run scripts/omlx_seat_defaults.py except --dry-run. Applying it rewrites
# ~/.omlx/model_settings.json and restarts oMLX. Qwen3.8-27B-oQ4e-mtp is already
# shared by more than one production seat; another seat must stay on request sampling.

# ---------- auto-coding.variants ----------

kit-qwen38-27b:
  name: "Kit heavy — Qwen3.8-27B oQ4e"
  client_tools_only: true
  description: "Test seat. oMLX Qwen3.8-27B-oQ4e-mtp by raw id (re-screen 2026-10-21). The id is already in live omlx-coding models, so engine is omlx and no Ollama alias can intercept. Directory mtime 2026-08-14, so label the run old oQe. Fallback target Qwen3.8-27B-4bit if the tool parser breaks."
  model_hint: Qwen3.8-27B-oQ4e-mtp
  context_limit: 131072
  predict_limit: 32768
  # qwen3.8 thinking arm. Unsloth Qwen3.8-27B-GGUF re-confirmed 2026-10-16
  # (model_card_expectations.yaml qwen3.8.recommended_sampling_modes.thinking).
  # recommended_sampling on that key is the instruct arm; this seat thinks, so it serves thinking.
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0
  think: true
  emits_reasoning: true
  mode: agentic
  guardrail: default
  tools:
    - explore_repository
    - read_text_file
    - list_directory
    - search_files
    - write_file
    - execute_bash
    - execute_python
    - execute_nodejs
    - sandbox_status
    - read_word_document
    - read_pdf
    - remember
    - recall

