# Paste-ready variant blocks. Do not edit config/portal.yaml from this repo.
# Paste under workspaces.auto-coding.variants (coding seats) or
# workspaces.auto-spl.variants (Nano). New keys only — do not replace incumbents.
# 2026-10-21 dense MLX re-screen: the Qwen3.8-27B and orcarouter hints now name
# oMLX directory ids, and kit-qwen36-27b is new. Every re-screen hint is a raw oMLX
# id registered on omlx-coding, so no hint can fall through to an Ollama GGUF tag
# if an alias line is missed.
# 2026-10-22 think A/B: the old think-on kit-qwen38-27b and kit-orcarouter seats are
# gone from this kit — they warn think_vs_card_policy against the qwen3.8 harness
# policy and the A/B replaces them. Qwen3.8-27B-oQ4e and orcarouter now arrive as
# `-a` plus `-b`, and kit-huihui36 / kit-qwen36-27b gain the same pair. Arm A is
# think off + card instruct sampling; arm B is think on + card thinking sampling +
# thinking_budget. The pair is the measurement: paste both arms, run A then B.
# After paste, regenerate derived routing on the live checkout. This worker did not.
# Do not run scripts/omlx_seat_defaults.py except --dry-run. Applying it rewrites
# ~/.omlx/model_settings.json and restarts oMLX. Qwen3.8-27B-oQ4e-mtp is already
# shared by more than one production seat; another seat must stay on request sampling.

