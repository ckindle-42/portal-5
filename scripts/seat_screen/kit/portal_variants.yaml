kit-qwen36-35b:
  name: "Kit heavy — Qwen3.6-35B-A3B UD"
  client_tools_only: true
  description: "Test seat. oMLX unsloth--Qwen3.6-35B-A3B-UD-MLX-4bit at 128K. Ollama fallback is the new ctx128k tag."
  model_hint: hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL-ctx128k
  context_limit: 131072
  predict_limit: 32768
  # qwen3.6 thinking_precise_coding. Unsloth GGUF confirmed 2026-10-16;
