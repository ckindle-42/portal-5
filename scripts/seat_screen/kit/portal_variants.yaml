# ---------- auto-coding.variants — ARM B (think on) ----------
# Think A/B: these four are the `think: true` arm on the same four oMLX ids as
# arm A, which lands beside them as `-a` (think off, card instruct sampling).
# Do not merge an `-a` block into a `-b`: the pair is the measurement.
# `thinking_budget` is the Pipeline per-seat field (plan/think-budget); it
# forwards as oMLX's top-level `thinking_budget` request field — the server's own
# wording: "maximum number of tokens allowed inside a thinking block".

kit-qwen38-27b-b:
  name: "Kit think-B — Qwen3.8-27B oQ4e"
  client_tools_only: true
  description: "Test seat, think A/B arm B. oMLX Qwen3.8-27B-oQ4e-mtp by raw id; card thinking sampling plus thinking_budget 8192. Pair with kit-qwen38-27b-a."
  model_hint: Qwen3.8-27B-oQ4e-mtp
  context_limit: 131072
  predict_limit: 32768
  # arm B sampling: qwen3.8 thinking mode — 1.0 / 0.95 / 20 / min_p 0 /
  # presence_penalty 0.0 / repetition_penalty 1.0. Source: Qwen/Qwen3.8-27B
  # README "Sampling Parameters" (read 2026-10-22); registry row
  # config/model_card_expectations.yaml qwen3.8.recommended_sampling_modes.thinking.
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0
  think: true
  # Deliberate override of the qwen3.8 card harness_policy.think=false: thinking
  # is the variable under test (settings_audit think_vs_card_policy -> INFO).
  think_override_reason: think A/B arm B — thinking is the variable under test; qwen3.8 card thinking sampling with thinking_budget 8192
  emits_reasoning: true
  # No card documents a per-request thinking cap. Qwen3.8 "Adequate Output
  # Length" gives separate reasoning 262,144 / final 131,072 as framework
  # limits — 262,144 exceeds this seat's predict_limit 32768, so it bounds
  # nothing. 8192 leaves 24,576 of 32768 for the answer.
  thinking_budget: 8192
  mode: agentic
  guardrail: default
  tools:
    - explore_repository
    - read_text_file
    - list_directory
    - search_files
    - write_file
    - execute_bash
