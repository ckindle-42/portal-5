T1557:
  description: "Adversary-in-the-middle — correlated NTLM network logon and privileged-share access across multiple Windows targets"
  matrix:
    - enterprise
  compliance_mapping:
    - framework: mitre-attack
      tactic: "credential-access"
      source: "portal-mitre-mcp:T1557"
    - framework: nist-800-53
      control: "IA-5"
      source: "NIST SP 800-53 Rev 5"
    - framework: nerc-cip
      requirement: "CIP-007-6 R5"
      source: "NERC CIP standard (public)"
    - framework: nerc-cip
      requirement: "CIP-007-6 R4"
      source: "NERC CIP standard (public)"
  spl: 'index=portal5_lab sourcetype="windows:security" ((EventCode=4624 LogonType=3 AuthenticationPackageName="NTLM") OR (EventCode=5140 (ShareName="*\\ADMIN$" OR ShareName="*\\C$"))) | eval relay_account=coalesce(Account, SubjectUserName), relay_ip=coalesce(IpAddress, SourceAddress) | stats count(eval(EventCode=4624)) as network_logons count(eval(EventCode=5140)) as privileged_share_access dc(host) as target_count values(ShareName) as shares by relay_ip, relay_account | where network_logons>0 AND privileged_share_access>0 AND target_count>1'
  expected_signal: "Same source/account produces NTLM network logons and privileged-share access across multiple Windows targets"
  spl_variants:
    - source: "windows:security"
      spl: 'index=portal5_lab sourcetype="windows:security" ((EventCode=4624 LogonType=3 AuthenticationPackageName="NTLM") OR (EventCode=5140 (ShareName="*\\ADMIN$" OR ShareName="*\\C$"))) | eval relay_account=coalesce(Account, SubjectUserName), relay_ip=coalesce(IpAddress, SourceAddress) | stats count(eval(EventCode=4624)) as network_logons count(eval(EventCode=5140)) as privileged_share_access dc(host) as target_count values(ShareName) as shares by relay_ip, relay_account | where network_logons>0 AND privileged_share_access>0 AND target_count>1'
      expected_signal: "Correlated multi-target NTLM logon and privileged-share access"
  distinguishing_features:
