# Doc-currency ledger — see scripts/doc_ledger.py.
# Each doc binds to the source paths that determine its correctness.
# last_reconciled_commit = the commit the doc was last verified against.
# A doc is STALE when a bound source changed in <commit>..HEAD.
# Re-stamp after reconciling: python3 scripts/doc_ledger.py stamp <doc>
# Never list a doc or this ledger as its own source.
