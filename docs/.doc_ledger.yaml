    - config/backends.yaml
    - portal/platform/inference/router/
    - portal/platform/inference/tool_registry.py
    - scripts/validate_system.py
    - launch.sh
    - portal/modules/
    - portal/platform/
    - portal_mcp/
    - .env.example
    - portal_wiki/canonical/
    last_reconciled_commit: f214af6446fe4e28e644e43384d7a82ba13d773b
