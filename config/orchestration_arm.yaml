# Gate A (Phase 0), measured 2026-10-21 with the full stack up: Fast + Deep need 37.8 GiB
# together; /admin/load-plan reported 25.7 GiB available (12.5 oMLX headroom + 15.2 freeable,
# minus margin), so they cannot co-reside -> swap mode. oMLX keeps one resident at a time.
# One-word turns through the Pipeline: Fast cold 15-18 s vs warm 0.3 s; Deep cold ~38 s vs
# warm 28 s (its xhigh thinking dominates). Swap cost ~15 s into Fast, ~10 s into Deep.
residency_mode: swap
load_plan_models:
  fast:
    engine: omlx
    model: unsloth--Qwen3.6-35B-A3B-UD-MLX-4bit
  deep:
    engine: omlx
    model: Qwen3.8-27B-oQ4e-mtp
residency_measured:
  date: "2026-10-21"
  pair_need_gib: 37.8
  available_gib: 25.7
  swap_cost_s:
    into_fast: 15
    into_deep: 10
