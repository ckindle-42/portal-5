# Generated arm policy from config/portal.yaml; seat identities remain operator-owned.
residency_mode: swap
load_plan_models:
  fast:
    engine: omlx
    model: unsloth--Qwen3.6-35B-A3B-UD-MLX-4bit
  deep:
    engine: omlx
    model: Qwen3.8-27B-oQ4e-mtp
residency_measured:
  date: '2026-10-21'
  pair_need_gib: 37.8
  available_gib: 25.7
  swap_cost_s:
    into_fast: 15
    into_deep: 10
planner:
  fast_context_budget_tokens: 32768
  comfortable_context_tokens: 16384
review:
  vote_count: 3
  minimum_approve_votes: 2
  high_risk:
    risk_levels:
    - high
    tools:
    - file_write
    write_scopes:
    - outside_task
approval:
  high_risk_writes: true
calibration:
  after_bites: 3
  minimum_pass_probability: null
  rates_by_discipline: {}
disciplines:
  test_fixing:
    selection_reason: Existing coding WFE work already uses hidden pytest tests as
      hard graders for repair tasks, so this candidate can measure correctness without
      model review.
    persona: auto-coding
    seated_models:
      fast: auto-daily::fast
      deep: auto-daily::deep
    tool_allowlist:
    - file_read
    - file_write
    - pytest_run
    read_tools:
    - file_read
    action_tools:
    - file_write
    - pytest_run
    write_scope: task_directory
    data_class: local-only
    procedures:
    - Read the failing source and tests, make the smallest fix, run the declared pytest
      check.
    bite_suite: tests/wfe/suites/orchestration_test_fixing.jsonl
    planner_suite: tests/wfe/orchestration/planner_suite.yaml
    checker_suite: tests/wfe/orchestration/checker_suite.yaml
    fast_context_budget_tokens: 32768
    pass_criteria:
      minimum_bite_pass_rate: 0.8
      minimum_fast_pass_rate: 0.8
      minimum_deep_pass_rate: 0.9
    plan_templates:
      repair_with_tests:
        parameters:
        - source_file
        - test_file
        - expected_behavior
        plan:
          goal: Repair $source_file to satisfy $expected_behavior, using $test_file
            for verification.
          bites:
          - bite_id: inspect
            goal: Read $source_file and $test_file; identify the smallest repair and
              the relevant behavior.
            discipline: test_fixing
            inputs:
            - $source_file
            - $test_file
            depends_on: []
            tools:
            - file_read
            output:
              path: bites/inspection.txt
              file_type: text
            accept:
            - type: contains
              value: 'Finding:'
            risk: low
            stage: work
            budget:
              turns: 3
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: fast
            procedure: Read the source and tests, then record the relevant failing
              behavior.
            reads_untrusted: false
          - bite_id: repair
            goal: Use the inspection to make the smallest change for $expected_behavior
              and run $test_file.
            discipline: test_fixing
            inputs:
            - inspect
            depends_on:
            - inspect
            tools:
            - file_write
            - pytest_run
            output:
              path: bites/repair.txt
              file_type: text
            accept:
            - type: contains
              value: PASS
            risk: low
            stage: assembly
            budget:
              turns: 5
              minutes: 30
              output_tokens: 4096
              context_tokens: 12288
            model: fast
            procedure: Apply the smallest repair, run the declared test, and report
              its result.
            reads_untrusted: false
          - bite_id: final_review
            goal: Review the repair and test evidence against $expected_behavior.
            discipline: test_fixing
            inputs:
            - repair
            depends_on:
            - repair
            tools: []
            output:
              path: bites/review.txt
              file_type: text
            accept: []
            review: deep
            review_reason: Confirm the code change and test evidence satisfy the expected
              behavior.
            risk: low
            stage: final_review
            budget:
              turns: 2
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: deep
            procedure: Review the repair and test evidence against the bite contract.
            reads_untrusted: false
