# Generated arm policy from config/portal.yaml; seat identities remain operator-owned.
residency_mode: swap
load_plan_models:
  fast:
    engine: ollama
    model: gemma4:26b-a4b-it-qat-ctx32k
  deep:
    engine: omlx
    model: Qwen3.8-27B-oQ4e-mtp
residency_measured:
  date: '2026-10-21'
  pair_need_gib: 37.8
  available_gib: 25.7
  swap_cost_s:
    into_fast: 15
    into_deep: 10
shadow_slot_wait_seconds: 300
planner:
  fast_context_budget_tokens: 32768
  comfortable_context_tokens: 16384
review:
  vote_count: 3
  minimum_approve_votes: 2
  high_risk:
    risk_levels:
    - high
    tools:
    - file_write
    write_scopes:
    - outside_task
approval:
  high_risk_writes: true
calibration:
  after_bites: 3
  minimum_pass_probability: 0.262144
  rates_by_discipline:
    test_fixing:
      fast:
        pass_probability: 1.0
        mean_seconds: 35.1
        samples: 6
      deep:
        pass_probability: 1.0
        mean_seconds: 34.6
        samples: 6
    detection-engineering:
      fast:
        pass_probability: 0.9167
        mean_seconds: 22.5
        samples: 12
      deep:
        pass_probability: 1.0
        mean_seconds: 22.2
        samples: 12
queue:
  yield_lock_dir: ~/.portal5/locks/
  escalation:
    enabled: false
    oracle:
      enabled: false
      tiers:
      - sol
      - grok-max
      - flagship
      - oc-deep-flash
      - oc-glm-flash
      - deep-pro
      security_tier: daybreak
      timeout_seconds: 1800
  telegram_control:
    enabled: false
disciplines:
  test_fixing:
    selection_reason: Existing coding WFE work already uses hidden pytest tests as
      hard graders for repair tasks, so this candidate can measure correctness without
      model review.
    persona: auto-coding
    seated_models:
      fast: auto-daily::gemma-fast
      deep: auto-daily::deep
    shadow_seats:
      read:
        model: portal5/spark-x2.6:q4_K_M-ctx64k
        timeout_seconds: 90
      check:
        model: portal5/spark-x2.6:q4_K_M-ctx64k
        timeout_seconds: 90
    tool_allowlist:
    - file_read
    - file_write
    - pytest_run
    read_tools:
    - file_read
    action_tools:
    - file_write
    - pytest_run
    write_scope: task_directory
    data_class: local-only
    procedures:
    - Read the failing source and tests, make the smallest fix, run the declared pytest
      check.
    bite_suite: tests/wfe/suites/orchestration_test_fixing.jsonl
    planner_suite: tests/wfe/orchestration/planner_suite.yaml
    checker_suite: tests/wfe/orchestration/checker_suite.yaml
    fast_context_budget_tokens: 32768
    pass_criteria:
      minimum_bite_pass_rate: 0.8
      minimum_fast_pass_rate: 0.8
      minimum_deep_pass_rate: 0.9
    plan_templates:
      repair_with_tests:
        parameters:
        - source_file
        - test_file
        - expected_behavior
        plan:
          goal: Repair $source_file to satisfy $expected_behavior, using $test_file
            for verification.
          bites:
          - bite_id: inspect
            goal: Read $source_file and $test_file; identify the smallest repair and
              the relevant behavior.
            discipline: test_fixing
            inputs:
            - $source_file
            - $test_file
            depends_on: []
            tools:
            - file_read
            output:
              path: bites/inspection.txt
              file_type: text
            accept:
            - type: contains
              value: 'Finding:'
            risk: low
            stage: work
            budget:
              turns: 4
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: fast
            procedure: Read the source and tests, then record the relevant failing
              behavior.
            reads_untrusted: false
          - bite_id: repair
            goal: Use the inspection to make the smallest change for $expected_behavior
              and run $test_file.
            discipline: test_fixing
            inputs:
            - $source_file
            - $test_file
            - inspect
            write_paths:
            - $source_file
            depends_on:
            - inspect
            tools:
            - file_write
            - pytest_run
            output:
              path: bites/repair.txt
              file_type: text
            accept:
            - type: contains
              value: PASS
            risk: low
            stage: assembly
            budget:
              turns: 5
              minutes: 30
              output_tokens: 12288
              context_tokens: 12288
            model: fast
            procedure: Apply the smallest repair, run the declared test, and report
              its result.
            reads_untrusted: false
          - bite_id: final_review
            goal: Review the repair and test evidence against $expected_behavior.
            discipline: test_fixing
            inputs:
            - repair
            depends_on:
            - repair
            tools: []
            output:
              path: bites/review.txt
              file_type: text
            accept: []
            review: deep
            review_reason: Confirm the code change and test evidence satisfy the expected
              behavior.
            risk: low
            stage: final_review
            budget:
              turns: 2
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: deep
            procedure: Review the repair and test evidence against the bite contract.
            reads_untrusted: false
  detection-engineering:
    selection_reason: The design names detection engineering as the starting candidate
      because lab-run SPL provides hard known-answer checks. Keep it unseated until
      its live Fast and Deep bite suite rates meet the frozen criteria; no model binding
      or calibration rate is selected.
    seating_status: seated
    seated_models:
      fast: auto-daily::gemma-fast
      deep: auto-daily::deep
    persona: splunkdetectionauthor
    tool_allowlist:
    - file_read
    - file_write
    - mitre_technique_lookup
    - mitre_data_sources_for_technique
    - mitre_detections_for_technique
    - mitre_techniques_list
    - spl_search_library
    - spl_explain_detection
    - spl_techniques_covered
    - spl_diff_hypothesis
    - query_splunk
    - query_windows_events
    - spl_validate_syntax
    - validate_sigma
    - convert_sigma
    - compile_yara
    read_tools:
    - file_read
    - mitre_technique_lookup
    - mitre_data_sources_for_technique
    - mitre_detections_for_technique
    - mitre_techniques_list
    - spl_search_library
    - spl_explain_detection
    - spl_techniques_covered
    - spl_diff_hypothesis
    - query_splunk
    - query_windows_events
    action_tools:
    - file_write
    - spl_validate_syntax
    - validate_sigma
    - convert_sigma
    - compile_yara
    write_scope: task_directory
    data_class: local-only
    procedures:
    - Map the ATT&CK technique and required data sources before authoring.
    - Read the local reference detection in a read-only bite before drafting.
    - Validate the exact artifact bytes; run SPL only in the read-only lab query tool.
    - Record ATT&CK mappings, data sources, time bounds, false positives, and tuning
      guidance.
    bite_suite: portal/modules/orchestration/disciplines/detection_engineering/wfe_bites.yaml
    planner_suite: portal/modules/orchestration/disciplines/detection_engineering/wfe_planner.yaml
    checker_suite: portal/modules/orchestration/disciplines/detection_engineering/wfe_checker_suite.yaml
    fast_context_budget_tokens: 32768
    pass_criteria:
      frozen_before_first_run: true
      checker_controls:
        scoring: majority_of_repeats
        false_passes: 0
        false_failures: 0
      per_seat_bite_suite:
        fast:
          minimum_passed: 3
          total: 4
        deep:
          minimum_passed: 4
          total: 4
      live_lab:
        required_cases_must_run: true
        known_answer_cases_must_pass: true
      first_real_run:
        final_status: PASS
        blocked_bites: 0
        deterministic_checks: all_pass
        red_flags: 0
    plan_templates:
      author_and_validate_detection:
        parameters:
        - reference_file
        - technique
        - expected_behavior
        plan:
          goal: Author and validate a detection for $technique that $expected_behavior.
          bites:
          - bite_id: research
            goal: Read $reference_file and map $technique to its data sources.
            discipline: detection-engineering
            inputs:
            - $reference_file
            depends_on: []
            tools:
            - file_read
            - mitre_technique_lookup
            - mitre_data_sources_for_technique
            - spl_search_library
            output:
              path: bites/research.txt
              file_type: text
            accept:
            - type: contains
              value: 'Finding:'
            risk: low
            stage: work
            budget:
              turns: 3
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: fast
            procedure: Map the technique, data sources, and local reference before
              drafting.
            reads_untrusted: true
          - bite_id: draft_validate
            goal: Draft the detection for $expected_behavior and validate the exact
              artifact.
            discipline: detection-engineering
            inputs:
            - research
            write_paths:
            - artifacts/detection.spl
            depends_on:
            - research
            tools:
            - file_write
            - spl_validate_syntax
            output:
              path: bites/draft_validate.txt
              file_type: text
            accept:
            - type: contains
              value: PASS
            risk: low
            stage: work
            budget:
              turns: 4
              minutes: 20
              output_tokens: 3072
              context_tokens: 12288
            model: fast
            procedure: Draft only inside the task directory and validate the exact
              bytes produced.
            reads_untrusted: false
          - bite_id: assembly
            goal: Assemble the detection, mapping, validation, and operational guidance.
            discipline: detection-engineering
            inputs:
            - research
            - draft_validate
            depends_on:
            - research
            - draft_validate
            tools: []
            output:
              path: bites/assembly.txt
              file_type: text
            accept:
            - type: contains
              value: PASS
            risk: low
            stage: assembly
            budget:
              turns: 3
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: fast
            procedure: Assemble the evidence and state false positives and tuning
              guidance.
            reads_untrusted: false
          - bite_id: final_review
            goal: Review the assembled detection against $expected_behavior and its
              evidence.
            discipline: detection-engineering
            inputs:
            - assembly
            depends_on:
            - assembly
            tools: []
            output:
              path: bites/final_review.txt
              file_type: text
            accept:
            - type: contains
              value: PASS
            risk: low
            stage: final_review
            budget:
              turns: 2
              minutes: 15
              output_tokens: 2048
              context_tokens: 8192
            model: deep
            procedure: Check the final artifact and evidence against the bite contract.
            reads_untrusted: false
