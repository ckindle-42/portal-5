# Eval-only OpenAI engines. Not part of the operator-owned backends: block.
# Exclusive workspace ids are always loaded. Backend entries merge only when
# module eval is enabled or PORTAL_ENABLE_EVAL / PORTAL_BENCH_WORKSPACES is set.
# Do not alias a production GGUF tag onto a different MLX id here.
exclusive_workspaces:
  - bench-engine-daily-moe
  - bench-engine-coding
  - bench-engine-task-router
  - bench-engine-hunt
  - bench-engine-council-json
backends:
  - id: eval-openai-omlx-incumbent
    type: eval_openai
    group: eval
    url: http://host.docker.internal:8085
    health_path: /v1/models
    priority: 10
    models:
      - {id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp, supports_tools: true}
      - {id: Qwen3.8-27B-4bit, supports_tools: true}
      - {id: gemma-4-26b-a4b-it-QAT-4bit, supports_tools: true}
  - id: eval-openai
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11234
    health_path: /v1/models
    priority: 10
    models:
      - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp
        supports_tools: true
      - id: Qwen3.8-27B-4bit
        supports_tools: true
      - id: gemma-4-26b-a4b-it-QAT-4bit
        supports_tools: true
      - id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k
        supports_tools: false
  - id: eval-openai-rapid-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11235
    health_path: /v1/models
    priority: 10
    models: &engine_eval_models
      - {id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp, supports_tools: true}
      - {id: Qwen3.8-27B-4bit, supports_tools: true}
      - {id: gemma-4-26b-a4b-it-QAT-4bit, supports_tools: true}
      - {id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k, supports_tools: false}
  - id: eval-openai-vllm-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11236
    health_path: /v1/models
    priority: 10
    # docs/engine_research/vllm_20261114.md § vllm-mlx 0.6.0: MTP does not disable streaming.
    note: "OpenAI SSE stays available with --enable-mtp and --stream-interval 1. Spec does not disable streaming. On 0.6.0 --enable-mtp is inert for nemotron_h (validation logs model.mtp is None; no injection path outside qwen3_next/qwen3_5). Final usage needs stream_options.include_usage=true. Per-seat argv is tests/benchmarks/engine_h2h.yaml engines.vllm-mlx.seats."
    models: *engine_eval_models
  # mlx_lm.server GET /v1/models lists the HF cache plus Path(--model).resolve()
  # (mlx_lm/server.py handle_models_request). The chat `model` it accepts is the
  # --model value, which this registry launches as a cwd-relative directory
  # (ModelProvider.load). That id is the seat hint below. The cache listing is
  # not the served set, so a health probe must not filter resolve_model by it.
  - id: eval-openai-mlx_lm.server
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11237
    health_path: /v1/models
    priority: 10
    listing_is_served_set: false
    models: *engine_eval_models
  # Ollama pair for Stage 3. Exclusive bench workspaces cannot pin the production
  # ollama backend. Tags are the registry ollama ids; hints alias onto them.
  - id: eval-openai-ollama-incumbent
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11434
    health_path: /v1/models
    priority: 10
    aliases:
      NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp: hf.co/bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_K_M-ctx32k
      Qwen3.8-27B-4bit: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k
      gemma-4-26b-a4b-it-QAT-4bit: gemma4:26b-a4b-it-qat-ctx16k
    models:
      - {id: hf.co/bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_K_M-ctx32k, supports_tools: true}
      - {id: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k, supports_tools: true}
      - {id: gemma4:26b-a4b-it-qat-ctx16k, supports_tools: true}
      - {id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k, supports_tools: false}
  - id: eval-openai-prismml-llama
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11238
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-prismml-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11239
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-brew-llama
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11240
    health_path: /v1/models
    priority: 10
    # docs/engine_research/gguf_20261114.md §1.4 readback contract.
    note: "Tokens are the OpenAI usage object (prompt_tokens/completion_tokens/total_tokens) on /v1/chat/completions; /completion adds timings; GET /metrics needs opt-in --metrics and is not launched. Settings readback is GET /props (model path; the alias is separate) and GET /slots (per-slot n_ctx, sampler params, speculative flag — the spec-cell proof). Resident memory is process-tree RSS beside the vm_stat wired delta (llama.cpp maps the GGUF into its process); GET /models memory field is unverified on this build until a canary reads it. Streaming under draft-mtp and stream_options.include_usage are preflight questions for the canary. Per-seat argv is tests/benchmarks/engine_h2h.yaml engines.brew-llama."
    # Only the checkpoints this engine registers a GGUF artifact for: the daily-moe
    # bartowski Q4_K_M blob (same bytes as the production tag, engine_h2h.yaml) and the
    # task-router tag it already serves. No artifact for the coding/hunt MLX ids exists.
    models:
      - {id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp, supports_tools: true}
      - {id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k, supports_tools: false}
  - id: eval-openai-mtplx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11241
    health_path: /v1/models
    priority: 10
    # docs/engine_research/mlxother_20261114.md § 4) MTPLX (Youssofal) coding row.
    note: "Serves the MTPLX pack Youssofal/Qwen3.8-27B-MTPLX-Optimized-Speed under the seat id Qwen3.8-27B-4bit (--model-id), so every bench workspace hint resolves unchanged. Think stays ON: bench-engine-coding pins think: true and mtplx serve --reasoning defaults to the Qwen3.8 codec default (auto -> enable_thinking true, effort medium). Per-seat argv is tests/benchmarks/engine_h2h.yaml engines.mtplx. Usage tokens, resident-memory readback and the MTP acceptance counters are unverified until the canary reads them."
    models: *engine_eval_models
  - id: eval-openai-splash
    type: eval_openai
    group: eval
    # docs/engine_research/mlxother_20261114.md § 3) Splash. This URL is 11242, not the
    # :8086 forwarder (scripts/splash-forwarder.sh relays to 127.0.0.1:8000). Splash binds
    # 0.0.0.0 so the container can connect, and --allowed-host host.docker.internal is what
    # makes this GET 200 instead of 403. /v1/models: the socket listens only after the
    # native child is ready (server.py binds, then activates). /health is not a load signal.
    url: http://host.docker.internal:11242
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-mlxcel
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11243
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-vllm-metal
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11244
    health_path: /v1/models
    priority: 10
    # docs/engine_research/vllm_20261114.md § vllm-metal 0.33.0 shared argv and registry proposal.
    note: "Per-seat argv is tests/benchmarks/engine_h2h.yaml engines.vllm-metal.seats. Served ids unchanged. Coding think on; hunt-reasoning leaves think unset. Qwen n-gram SSE is unverified (include_usage). Memory is /metrics plus vm_stat. Froggeric v22.1 template and the corrected Qwen processor revision are pending: config/engine_artifacts_20261114.yaml is not on main."
    models: *engine_eval_models
