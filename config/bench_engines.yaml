# Eval-only OpenAI engines. Not part of the operator-owned backends: block.
# Exclusive workspace ids are always loaded. Backend entries merge only when
# module eval is enabled or PORTAL_ENABLE_EVAL / PORTAL_BENCH_WORKSPACES is set.
# Do not alias a production GGUF tag onto a different MLX id here.
exclusive_workspaces:
  - bench-engine-daily-moe
  - bench-engine-coding
  - bench-engine-task-router
  - bench-engine-hunt
  - bench-engine-council-json
backends:
  - id: eval-openai-omlx-incumbent
    type: eval_openai
    group: eval
    url: http://host.docker.internal:8085
    health_path: /v1/models
    priority: 10
    models:
      - {id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp, supports_tools: true}
      - {id: Qwen3.8-27B-4bit, supports_tools: true}
      - {id: gemma-4-26b-a4b-it-QAT-4bit, supports_tools: true}
  - id: eval-openai
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11234
    health_path: /v1/models
    priority: 10
    models:
      - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp
        supports_tools: true
      - id: Qwen3.8-27B-4bit
        supports_tools: true
      - id: gemma-4-26b-a4b-it-QAT-4bit
        supports_tools: true
      - id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k
        supports_tools: false
  - id: eval-openai-rapid-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11235
    health_path: /v1/models
    priority: 10
    models: &engine_eval_models
      - {id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp, supports_tools: true}
      - {id: Qwen3.8-27B-4bit, supports_tools: true}
      - {id: gemma-4-26b-a4b-it-QAT-4bit, supports_tools: true}
      - {id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k, supports_tools: false}
  - id: eval-openai-vllm-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11236
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  # mlx_lm.server GET /v1/models lists the HF cache plus Path(--model).resolve()
  # (mlx_lm/server.py handle_models_request). The chat `model` it accepts is the
  # --model value, which this registry launches as a cwd-relative directory
  # (ModelProvider.load). That id is the seat hint below. The cache listing is
  # not the served set, so a health probe must not filter resolve_model by it.
  - id: eval-openai-mlx_lm.server
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11237
    health_path: /v1/models
    priority: 10
    listing_is_served_set: false
    models: *engine_eval_models
  # Ollama pair for Stage 3. Exclusive bench workspaces cannot pin the production
  # ollama backend. Tags are the registry ollama ids; hints alias onto them.
  - id: eval-openai-ollama-incumbent
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11434
    health_path: /v1/models
    priority: 10
    aliases:
      NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp: hf.co/bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_K_M-ctx32k
      Qwen3.8-27B-4bit: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k
      gemma-4-26b-a4b-it-QAT-4bit: gemma4:26b-a4b-it-qat-ctx16k
    models:
      - {id: hf.co/bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_K_M-ctx32k, supports_tools: true}
      - {id: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k, supports_tools: true}
      - {id: gemma4:26b-a4b-it-qat-ctx16k, supports_tools: true}
      - {id: hf.co/mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF:Q4_K_M-ctx2k, supports_tools: false}
  - id: eval-openai-prismml-llama
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11238
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-prismml-mlx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11239
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-brew-llama
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11240
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-mtplx
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11241
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-splash
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11242
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-mlxcel
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11243
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
  - id: eval-openai-vllm-metal
    type: eval_openai
    group: eval
    url: http://host.docker.internal:11244
    health_path: /v1/models
    priority: 10
    models: *engine_eval_models
