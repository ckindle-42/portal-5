  # Nemotron 3.5 Lightning oQ4e-mtp added 2026-08-14 (txgsync/NVIDIA-Nemotron-
  # 3.5-Lightning-30B-A3B-oQ4e-mtp, oMLX 0.6.0.dev1 MTPLX side-car import —
  # real mtp.* weights verified at the tensor level, unlike the plain
  # mlx-community 4bit conversion which ships none). MTP path activates live:
  # 76-87% draft accept rate (MoE ~3B active params/token keeps the verify
  # backbone cheap), 70.0-70.3 tok/s vs 52.9-53.1 tok/s Ollama GGUF baseline
  # (~1.33x), same prompt/hardware/session. supports_tools:true verified via
  # direct tool-call probe.
  - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp
    supports_tools: true
  priority: 10
  aliases:
    gemma4:26b-a4b-it-qat-ctx8k: gemma-4-26b-a4b-it-QAT-4bit
    hf.co/bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_K_M-ctx8k: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-oQ4e-mtp
  type: omlx
