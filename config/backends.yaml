# omlx-reasoning: reasoning-group workspaces (auto-research, auto-compliance,
# auto-data fallbacks) pin DIFFERENT model_hints in config/portal.yaml. The
# MLX conversions were re-pulled 2026-08-31 (TASK_OMLX_REASONING_POOL_REPAIR_V1)
# after their hf-cache snapshots were pruned, leaving the omlx-models/ symlinks
# dangling — the pipeline had been reporting this group "healthy" while it
# black-holed every request (fixed: Backend.live_models check in
# cluster_backends.py). Tongyi-DeepResearch-30B / granite-4.1-30b /
# granite-4.1-8b-mxfp8 re-audited for tool-calling on oMLX 0.6.4 — all clean.
#
# DeepSeek-R1-0528-Qwen3-8B deliberately NOT here: oMLX 0.6.4's tool_calling.py
# has no parser for DeepSeek's `<｜tool▁calls▁begin｜>` format (the model emits a
# clean, well-formed call — tokenizer_config/chat_template in the model dir were
# fixed — but oMLX drops it). A parser is a per-brew-upgrade maintenance burden
# for a speed shadow-shift; auto-reasoning stays on the Ollama GGUF
# (hf.co/unsloth/DeepSeek-R1-0528-Qwen3-8B-GGUF), tool-calling fix baked in,
# verified in production.
- group: reasoning
  id: omlx-reasoning
  models:
  - id: Tongyi-DeepResearch-30B-A3B-abliterated-4bit
    supports_tools: true
  - id: granite-4.1-30b-4bit
    supports_tools: true
  - id: granite-4.1-8b-mxfp8
    supports_tools: true
  - id: Qwen3.8-27B-oQ4e-mtp
    supports_tools: true
  priority: 10
  aliases:
    huihui_ai/tongyi-deepresearch-abliterated:latest-ctx64k: Tongyi-DeepResearch-30B-A3B-abliterated-4bit
    granite4.1:30b-ctx64k: granite-4.1-30b-4bit
    granite4.1:8b-ctx16k: granite-4.1-8b-mxfp8
    # Tier-2 deep lane — auto-reasoning?variant=deep. Same MTP checkpoint the
    # omlx-coding group serves; aliased here so the reasoning group resolves it.
    hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k: Qwen3.8-27B-oQ4e-mtp
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
- group: security
  id: omlx-security
  # RBP arm coverage (2026-08-10): auto-security folds 8 role variants
  # (uncensored/pentest/blueteam/redteam/redteam-deep/purpleteam/
  # purpleteam-deep/purpleteam-exec), each pinning a DIFFERENT model_hint —
  # the base VulnLLM alias above only covered plain auto-security requests.
  # Four variants added here for free: their oMLX conversions were already
  # on disk (shared with omlx-creative/omlx-reasoning, or previously
  # unregistered), each live tool-call-audited before being added. Two
  # roles (redteam-deep, purpleteam-exec — supergemma4-26b-uncensored)
  # deliberately NOT added: the only supergemma4-26b MLX conversion on
  # disk is Jiunsong/supergemma4-26b-abliterated-multimodal, a DIFFERENT
  # base checkpoint per its own README (not the -uncensored repo Ollama
  # actually serves) — aliasing it would be a silent model substitution.
  # Left Ollama-backed until a correct conversion is deliberately pulled.
  # `uncensored` (baronllm-abliterated) also left Ollama-backed — no oMLX
  # conversion on disk, deferred pending a disk-usage reassessment.
  models:
  - id: VulnLLM-R-7B-4bit
    supports_tools: true
  - id: Qwen3.6-35B-A3B-HauhauCS-Aggressive-4bit
    supports_tools: true
  - id: granite-4.1-8b-mxfp8
    supports_tools: true
  - id: huihui-ai--Huihui-Qwen3.5-9B-abliterated-mlx-4bit
    supports_tools: true
  priority: 10
  aliases:
    hf.co/mradermacher/VulnLLM-R-7B-GGUF:q4_K_M-ctx8k: VulnLLM-R-7B-4bit
    fredrezones55/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4-ctx8k: Qwen3.6-35B-A3B-HauhauCS-Aggressive-4bit
    granite4.1:8b-ctx8k: granite-4.1-8b-mxfp8
    huihui_ai/qwen3.5-abliterated:9b-ctx8k: huihui-ai--Huihui-Qwen3.5-9B-abliterated-mlx-4bit
    huihui_ai/qwen3.5-abliterated:9b-ctx64k: huihui-ai--Huihui-Qwen3.5-9B-abliterated-mlx-4bit
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
