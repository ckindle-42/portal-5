# oMLX evaluation backend (P5-FUT-013 Phase 1, 2026-08-02).
# Registered in holding group "omlx" — no workspace_routing entry references it,
# so the only way traffic reaches it is the tier-3 absolute-fallback net.
# Group/priority/aliases for production workspaces are wired per-workspace in
# Phase 2 (PUNCHLIST B2).
# F4 (TASK_PIPELINE_OMLX_CORRECTIONS_V1, 2026-08-05): tier-3-only is
# intentional for production routing, not a bug — omlx-coding below (priority
# 10) is the deliberate, workspace-routed shadow-shift candidate; omlx-local
# stays a no-traffic holding group. It needs no routing change to be
# exercised by TASK_OMLX_OLLAMA_MULTIMODEL_BAKEOFF_V1 — the shootout gate
# talks to :8085 directly.
# Disk-cleanup pass (2026-08-10, see config/UNUSED_MODELS_20260810.md): the
# broader vision/VLM/MTP model set this group used to hold
# (gemma-4-e4b-it-4bit, supergemma4-26b-abliterated-multimodal, Qwen3-VL-32B,
# Qwen3.6-27B-oQ8-mtp, Llama-3.2-3B-Instruct-8bit, Phi-4-reasoning-plus — none
# ever reachable, this group serves zero production traffic) was deleted from
# disk to reclaim ~73.5GB; only the two models still live elsewhere
# (omlx-coding) remain listed here, since their files still exist. If a
# future bake-off needs the broader set back, re-pull deliberately rather
# than assuming these entries were ever wrong to remove.
- group: omlx
  id: omlx-local
  models:
  - id: Qwen3-Coder-30B-A3B-Instruct-4bit
    supports_tools: true
  - id: Laguna-XS.2-4bit
    supports_tools: true
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
# oMLX shadow-then-shift for the coding group (PUNCHLIST B2, 2026-08-02).
# Same URL/engine as omlx-local; separate entry because it's the live
# `group: coding` candidate (auto-coding workspace_routing) rather than the
# no-traffic holding group above. priority: 10 makes oMLX the preferred
# candidate ahead of the Ollama entries in this group (default priority 0);
# when oMLX is unhealthy, get_backend_candidates falls back to Ollama
# automatically and `_hint_fallback` fires honestly. aliases translate the
# GGUF model_hint each workspace already carries to this backend's native
# oMLX directory name — no workspace_routing or persona change needed.
- group: coding
  id: omlx-coding
  models:
  - id: Qwen3-Coder-30B-A3B-Instruct-4bit
    supports_tools: true
  - id: Laguna-XS.2-4bit
    supports_tools: true
  priority: 10
  aliases:
    qwen3-coder:30b-a3b-q4_K_M-ctx16k: Qwen3-Coder-30B-A3B-Instruct-4bit
    laguna-xs.2:Q4_K_M-ctx64k: Laguna-XS.2-4bit
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
# oMLX shadow-shift extended to the rest of the daily fleet
# (TASK_OMLX_FULL_PIPELINE_COVERAGE_V1, 2026-08-09). Same pattern as
# omlx-coding above: priority 10, no workspace_routing change, automatic
# Ollama fallback via get_backend_candidates when oMLX is unhealthy/rejects.
# supports_tools measured live per model (Phase 1 audit), not assumed.
#
# omlx-reasoning note: DeepSeek-R1-0528-Qwen3-8B-4bit initially audited NO
# (0/N tool calls) — root-caused, not worked around: (1) tokenizer_config.json
# mislabeled tokenizer_class as LlamaTokenizerFast for a ByteLevel-BPE
# tokenizer.json, which corrupted decode (raw Ġ/Ċ byte markers leaking into
# output) — fixed to PreTrainedTokenizerFast; (2) the upstream deepseek-ai
# chat_template.jinja never renders the `tools` kwarg into the prompt at
# all — replaced with unsloth's DeepSeek-R1-0528-Qwen3-8B canonical
# tool-calling template (sourced from sglang's official
# tool_chat_template_deepseekr1.jinja, not hand-authored); (3) no mlx_lm
# tool_parser recognized DeepSeek's `<｜tool▁calls▁begin｜>` format — added
# mlx_lm/tool_parsers/deepseek_r1.py to the running oMLX install
# (opt/homebrew/Cellar/omlx) and set tool_parser_type: deepseek_r1 in this
# model's tokenizer_config.json (same explicit-override pattern as the prior
# Laguna tool-parser fix, not a global auto-inference change). Re-audited:
# 100% (6/6) at temperature=0, ~50-60% at default sampling — this 8B distill
# sometimes reasons its way out of calling the tool. supports_tools: true
# reflects a genuinely functional (if temperature-sensitive) capability, not
# a silent-failure flag; if the soak shows this instability matters in
# practice, the lever is a lower default temperature for the reasoning
# group's workspaces in config/portal.yaml (out of scope here).
- group: general
  id: omlx-general
  models:
  - id: gemma-4-26b-a4b-it-QAT-4bit
    supports_tools: true
  priority: 10
  aliases:
    gemma4:26b-a4b-it-qat-ctx8k: gemma-4-26b-a4b-it-QAT-4bit
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
# omlx-reasoning carries 4 models, not 1: the reasoning group's daily
# workspaces (auto-reasoning, auto-research, auto-compliance, auto-data) each
# pin a DIFFERENT model_hint in config/portal.yaml — DeepSeek-R1 alone only
# covered auto-reasoning, leaving the other three falling through to Ollama
# even though oMLX health was fine (verified via Phase 4 x-portal-route: they
# resolved to ollama-reasoning because their hint had no alias here, not
# because of an admission reject). Tongyi-DeepResearch-30B/granite-4.1-30b/
# granite-4.1-8b-mxfp8 were already on disk (TASK_DAILY_WORK_FLEET_SOAK_V1's
# own per-category model table) and live-audited for tool-calling the same
# way as the primary 4 (all YES, no template/tokenizer defects). Same
# multi-model-per-group pattern as omlx-coding above.
- group: reasoning
  id: omlx-reasoning
  models:
  - id: DeepSeek-R1-0528-Qwen3-8B-4bit
    supports_tools: true
  - id: Tongyi-DeepResearch-30B-A3B-abliterated-4bit
    supports_tools: true
  - id: granite-4.1-30b-4bit
    supports_tools: true
  - id: granite-4.1-8b-mxfp8
    supports_tools: true
  priority: 10
  aliases:
    hf.co/unsloth/DeepSeek-R1-0528-Qwen3-8B-GGUF:Q4_K_XL-ctx64k: DeepSeek-R1-0528-Qwen3-8B-4bit
    huihui_ai/tongyi-deepresearch-abliterated:latest-ctx64k: Tongyi-DeepResearch-30B-A3B-abliterated-4bit
    granite4.1:30b-ctx64k: granite-4.1-30b-4bit
    granite4.1:8b-ctx16k: granite-4.1-8b-mxfp8
  type: omlx
  url: ${OMLX_URL:-http://host.docker.internal:8085}
- group: security
  id: omlx-security
  # RBP arm coverage (2026-08-10): auto-security folds 8 role variants
  # (uncensored/pentest/blueteam/redteam/redteam-deep/purpleteam/
  # purpleteam-deep/purpleteam-exec), each pinning a DIFFERENT model_hint —
  # the base VulnLLM alias above only covered plain auto-security requests.
  # Four variants added here for free: their oMLX conversions were already
  # on disk (shared with omlx-creative/omlx-reasoning, or previously
  # unregistered), each live tool-call-audited before being added. Two
  # roles (redteam-deep, purpleteam-exec — supergemma4-26b-uncensored)
