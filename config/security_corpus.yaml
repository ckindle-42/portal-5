schema_version: 1
answer_key_visibility: scorer_only

# SCENARIOS is a mixed planning catalog. These entries remain useful theory
# exercises, but there is no deployed target contract that can produce honest
# live telemetry for them today. They are reported explicitly and excluded
# from the lab-replay denominator; moving one into the lab lane requires a
# real target plus capture validator, not merely deleting it from this list.
scenario_scope:
  excluded_from_lab_replay:
    cloud_breach: cloud emulator and cloud-provider telemetry are not deployed
    web_asset_discovery: generic endpoint has no deployed target contract
    web_cache_deception: generic endpoint has no deployed target contract
    web_cors: generic endpoint has no deployed target contract
    web_deserial_rce: generic endpoint has no deployed target contract
    web_forced_error: generic endpoint has no deployed target contract
    web_graphql_introspect: generic endpoint has no deployed target contract
    web_header_injection: generic endpoint has no deployed target contract
    web_idor: generic endpoint has no deployed target contract
    web_nosql_inject: generic endpoint has no deployed target contract
    web_nuclei_scan: generic endpoint has no deployed target contract
    web_open_redirect: generic endpoint has no deployed target contract
    web_path_traversal: generic endpoint has no deployed target contract
    web_reflected_xss: generic endpoint has no deployed target contract
    web_smuggling: generic endpoint has no deployed target contract
    web_sqli_dump: generic endpoint has no deployed target contract
    web_ssrf: generic endpoint has no deployed target contract
    web_ssti: generic endpoint has no deployed target contract
    web_ssti_stored: generic endpoint has no deployed target contract
    web_upload_bypass: generic endpoint has no deployed target contract

# These lanes are scored separately.  A technique-level corpus hit can extend
# detection coverage, but only portal_live can prove an end-to-end lab scenario.
sources:
  portal_live:
    data_mode: lab-exercise
    evidence_origin: "live:portal:red"
    labeled: true
    scenario_proof: true
    require_schema_version: 2
    require_episode_id: true
    require_validity: true
    require_pcap: true

  public_labeled:
    data_mode: external-labeled
    evidence_origin: "corpus:*"
    labeled: true
    scenario_proof: false
    require_live_probe: true

  caldera_live:
    data_mode: live-emulation
    evidence_origin: "live:caldera:*"
    labeled: false
    scenario_proof: false
    purpose: discovery

  benign:
    data_mode: benign
    evidence_origin: "benign:*"
    labeled: true
    scenario_proof: false
    purpose: precision

gates:
  require_source_stratified_results: true
  require_live_scenario_proof: true
  require_external_probe: true
  allow_external_scenario_substitution: false
