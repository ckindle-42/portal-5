global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Portal Pipeline — exposes /metrics with workspace counters, backend health
  - job_name: 'portal-pipeline'
    bearer_token: '${PIPELINE_API_KEY}'
    static_configs:
      - targets: ['portal-pipeline:9099']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Ollama — exposes /metrics in versions >= 0.3.0
  # If scraping fails (older Ollama), Prometheus will retry silently
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']          # Docker-profile Ollama
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'ollama-native'
    static_configs:
      - targets: ['host.docker.internal:11434']   # Native Ollama (default setup)
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Orchestrated-worker usage: plan quota straight from the vendors (Z.ai Coding Plan
  # pools, DeepSeek and Moonshot balances) plus per-tier spend from the dispatcher's
  # registry. Host-native exporter; it caches vendor polls for an hour, so scraping
  # more often than that costs nothing upstream.
  - job_name: 'orchestrate-usage'
    static_configs:
      - targets: ['host.docker.internal:8947']
    metrics_path: '/metrics'
    scrape_interval: 300s
    scrape_timeout: 60s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s
