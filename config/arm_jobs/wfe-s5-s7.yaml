id: wfe-s5-s7
purpose: >-
  The research, general and coding live slices (WFE S5-S7): the three committed seat-decision plans
  run their screen tier through the pipeline, one campaign per slice, with each slice's advance list
  written from its own rows. Read each slice's screen-out cell lines and advance list (per-arm
  PASS/BUDGET_EXHAUSTED/latency: `report --campaign <slice id>`); a seat whose challenger separated
  earns a confirm campaign, built as a separate job from the advance file. Arms too large to measure beside the stack are excluded by the plans
  themselves and belong to the stack-down discovery sweep, never to a seat decision.
preconditions:
  stack: up
  free_memory_gib: 24
  disk_free_gib: 30
steps:
  - id: research-screen
    argv:
      - scripts/wfe_campaign.sh
      - wfe_s5_research_screen_20261029
      - "--plan"
      - tests/wfe/plans/research_decision_v1.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 18000
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/wfe_s5_research_screen_20261029/manifest.json
  - id: research-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - wfe_s5_research_screen_20261029
      - "--screen-out"
      - tests/wfe/results/advance/advance_wfe_s5_research_20261029.yaml
    timeout_seconds: 900
    quiet_host: false
    outputs:
      - tests/wfe/results/advance/advance_wfe_s5_research_20261029.yaml
  - id: general-screen
    argv:
      - scripts/wfe_campaign.sh
      - wfe_s6_general_screen_20261029
      - "--plan"
      - tests/wfe/plans/general_decision_v1.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 64800
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/wfe_s6_general_screen_20261029/manifest.json
  - id: general-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - wfe_s6_general_screen_20261029
      - "--screen-out"
      - tests/wfe/results/advance/advance_wfe_s6_general_20261029.yaml
    timeout_seconds: 900
    quiet_host: false
    outputs:
      - tests/wfe/results/advance/advance_wfe_s6_general_20261029.yaml
  - id: coding-screen
    argv:
      - scripts/wfe_campaign.sh
      - wfe_s7_coding_screen_20261029
      - "--plan"
      - tests/wfe/plans/coding_decision_v1.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 18000
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/wfe_s7_coding_screen_20261029/manifest.json
  - id: coding-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - wfe_s7_coding_screen_20261029
      - "--screen-out"
      - tests/wfe/results/advance/advance_wfe_s7_coding_20261029.yaml
    timeout_seconds: 900
    quiet_host: false
    outputs:
      - tests/wfe/results/advance/advance_wfe_s7_coding_20261029.yaml
stop_conditions:
  on_failure: stop
  max_job_minutes: 1800
report:
  fields:
    - status
    - purpose
    - steps
    - outputs
    - checkpoints
    - failures
    - memory
    - duration
    - resume
