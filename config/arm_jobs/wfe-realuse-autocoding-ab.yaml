id: wfe-realuse-autocoding-ab
purpose: >-
  auto-coding seat decision: Flint vs production qwen3-coder (oMLX) under the gentler append
  (f79f80e8), on the realuse_v1 auto-coding rows. Fresh campaign id (20261030c): the first
  canary ran before the eval sandbox mount fix (2a10bf8b) and its rows are SETUP. Swap only if
  Flint still wins on checks and blind preference. Canary first; council after the report.
preconditions:
  stack: up
  free_memory_gib: 24
  disk_free_gib: 20
steps:
  - id: ac-ab-canary
    canary: ac-ab
    timeout_seconds: 7200
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/realuse_autocoding_ab_20261030c_canary/manifest.json
  - id: ac-ab
    argv:
      - scripts/wfe_campaign.sh
      - realuse_autocoding_ab_20261030c
      - "--plan"
      - tests/wfe/plans/realuse_v1_autocoding_ab.yaml
      - "--tier"
      - realuse
      - "--engine"
      - pipeline
      - "--judge"
    timeout_seconds: 21600
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/realuse_autocoding_ab_20261030c/manifest.json
  - id: ac-ab-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - realuse_autocoding_ab_20261030c
    timeout_seconds: 900
    quiet_host: false
  - id: ac-ab-judge-council
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.judge_council
      - "--campaign"
      - realuse_autocoding_ab_20261030c
    timeout_seconds: 900
    quiet_host: false
stop_conditions:
  on_failure: stop
  max_job_minutes: 600
report:
  fields:
    - status
    - purpose
    - steps
    - outputs
    - checkpoints
    - failures
    - memory
    - duration
    - resume
