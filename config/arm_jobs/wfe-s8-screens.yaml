id: wfe-s8-screens
purpose: >-
  The remaining S8 screens (docs/MODEL_INTAKE_FRESHNESS_20261029.md items 1-3): LFM2.5-24B-A2B
  against the general-fast/tools-specialist seats, Flint against auto-coding, Mellum 2.1 against
  the fast-repair variant. Each screen runs through the pipeline and writes its own advance list.
  Read the screen-out cell lines and advance list (per-arm PASS/BUDGET_EXHAUSTED/latency via
  `report --campaign <id>`): a screen DROP ends that intake item, an ADVANCE earns a confirm. The intake tags must be installed and registered before this
  job runs; a missing tag reports MISSING and is not a result.
preconditions:
  stack: up
  free_memory_gib: 24
  disk_free_gib: 40
steps:
  - id: lfm25-screen
    argv:
      - scripts/wfe_campaign.sh
      - s8_lfm25_screen_20261029
      - "--plan"
      - tests/wfe/plans/s8_lfm25_general_screen_20261029.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 21600
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/s8_lfm25_screen_20261029/manifest.json
  - id: lfm25-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - s8_lfm25_screen_20261029
      - "--screen-out"
      - tests/wfe/plans/advance_s8_lfm25_20261029.yaml
    timeout_seconds: 900
    outputs:
      - tests/wfe/plans/advance_s8_lfm25_20261029.yaml
  - id: flint-screen
    argv:
      - scripts/wfe_campaign.sh
      - s8_flint_screen_20261029
      - "--plan"
      - tests/wfe/plans/s8_flint_coding_screen_20261029.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 21600
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/s8_flint_screen_20261029/manifest.json
  - id: flint-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - s8_flint_screen_20261029
      - "--screen-out"
      - tests/wfe/plans/advance_s8_flint_20261029.yaml
    timeout_seconds: 900
    outputs:
      - tests/wfe/plans/advance_s8_flint_20261029.yaml
  - id: mellum-screen
    argv:
      - scripts/wfe_campaign.sh
      - s8_mellum_screen_20261029
      - "--plan"
      - tests/wfe/plans/s8_mellum_fast_repair_screen_20261029.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 14400
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/s8_mellum_screen_20261029/manifest.json
  - id: mellum-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - s8_mellum_screen_20261029
      - "--screen-out"
      - tests/wfe/plans/advance_s8_mellum_20261029.yaml
    timeout_seconds: 900
    outputs:
      - tests/wfe/plans/advance_s8_mellum_20261029.yaml
stop_conditions:
  on_failure: stop
  max_job_minutes: 1000
report:
  fields:
    - status
    - purpose
    - steps
    - outputs
    - checkpoints
    - failures
    - memory
    - duration
    - resume
