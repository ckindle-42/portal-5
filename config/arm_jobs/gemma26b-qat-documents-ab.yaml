id: gemma26b-qat-documents-ab
purpose: >-
  Fair auto-documents QAT vs plain-4bit confirm at the seat's own sampling on oMLX. The QAT
  production switch is already staged; this job records the four-repeat routed comparison.
preconditions:
  stack: up
  free_memory_gib: 24
  disk_free_gib: 30
steps:
  - id: documents-seat-ab
    argv:
      - scripts/wfe_campaign.sh
      - gemma26b_documents_qat_ab_20261106
      - --plan
      - tests/wfe/plans/realuse_v1_documents_qat_omlx.yaml
      - --tier
      - confirm
      - --repeats
      - "4"
      - --engine
      - pipeline
    timeout_seconds: 14400
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/gemma26b_documents_qat_ab_20261106/manifest.json
stop_conditions:
  on_failure: stop
  max_job_minutes: 240
report:
  fields: [status, purpose, steps, outputs, checkpoints, failures, memory, duration, resume]
