id: seat-vs-card-sampling-ab
purpose: >-
  A/B every traffic-carrying seat between the sampling production serves and the same model at its
  vendor card's sampling (docs/TASK_SEAT_SAMPLING_AB_V1.md). Both arms run the seat's own suite
  through the pipeline, at the same seeds, so the only difference is the sampling block. Screen
  tier: 12 tasks per arm, one repeat. Read the screen-out cell lines (verdict, workspace,
  candidate, reason) and the advance list; per-arm PASS/BUDGET_EXHAUSTED/latency come from
  `report --campaign seat_card_screen_20261029` when a seat earns its confirm.
preconditions:
  stack: up
  free_memory_gib: 24
  disk_free_gib: 30
steps:
  - id: screen
    argv:
      - scripts/wfe_campaign.sh
      - seat_card_screen_20261029
      - "--plan"
      - tests/wfe/plans/seat_card_sampling_ab_20261029.yaml
      - "--tier"
      - screen
      - "--engine"
      - pipeline
    timeout_seconds: 43200
    outputs:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/seat_card_screen_20261029/manifest.json
    checkpoints:
      - ~/AI_Output/portal-data/tests/wfe/results/campaigns/seat_card_screen_20261029/manifest.json
  - id: screen-report
    argv:
      - uv
      - run
      - python
      - "-m"
      - tests.wfe.report
      - "--campaign"
      - seat_card_screen_20261029
      - "--screen-out"
      - tests/wfe/results/advance/advance_seat_card_screen_20261029.yaml
    timeout_seconds: 900
    outputs:
      - tests/wfe/results/advance/advance_seat_card_screen_20261029.yaml
stop_conditions:
  on_failure: stop
  max_job_minutes: 840
report:
  fields:
    - status
    - purpose
    - steps
    - outputs
    - checkpoints
    - failures
    - memory
    - duration
    - resume
