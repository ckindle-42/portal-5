# Six CIP-007-6 acceptance cases.
#
# TASK_COMPLIANCE_WINDOW_AND_SEAT_V1 §P6. Live only, through the deployed
# compliance-reading workspace on /v1. The first four cases are TURNS of one
# thread (`thread: main`) — that is what makes them a conversation rather than
# six audits; the last two open their own threads because they test different
# shapes and must not inherit the main thread's context.
#
# WINDOW_AND_SEAT_V1 §P6.5: the string-matching rubric was DELETED —
# `required_citations`, `forbidden_citations`, `arithmetic`, `must_state`,
# `must_not_state` all went. A rubric that scores prose by string match
# produced every false failure the last campaign recorded (`choice` failed 0/3
# on a CORRECT answer whose "No." answered the question it was asked). What a
# machine can still check, it does: every cited id resolves, a tool call was
# made, the prompt was not truncated (missing input fails), the campaign
# completed its planned cells. Whether an answer UNDERSTOOD the material is
# judged by the agent, which reads each transcript and writes PASS or FAIL
# with its reasons beside it.
#
# Every case's `derived_from` list records the section ids the case was
# derived from, by READING the real material. Nothing here is invented, and no
# operator document was manufactured to fill a case. Measured on the live
# store (WINDOW_AND_SEAT_V1 §P6.3): every CIP-007-6 Part has at least one
# operator section — Part 5.2 is the minimum at exactly one, and that one
# section restates the requirement verbatim rather than describing a practice,
# which is the absence shape `no_operator_side` tests, reached honestly.
# Every operator edge in the population carries link_status `proposed`.

