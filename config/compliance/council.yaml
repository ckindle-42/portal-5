# ── the reading seats (BILATERAL_CORPUS_V1 P6.8) ───────────────────────────
#
# NOT council seats. The council is three models voting on a JSON verdict over
# a pre-analysed packet; this is one model reading a bilateral neighbourhood and
# answering an analyst in prose. Different question, different packet, chosen
# separately and chosen BY READING THE ANSWERS — reports/compliance/
# BILATERAL_CORPUS_V1.md §7 carries the transcripts and the argument.
#
# HARD CONSTRAINT: every seat here runs co-resident with the full Docker stack.
# This is a module inside the product, not something you take the product down
# to use. granite4.1:30b is excluded on footprint alone — 36.4 GB resident at
# 32k context, which cannot co-exist with 22 containers on this machine and put
# it into 50 GB of swap when tried.
#
# THE SEAT FOLLOWS THE PACKET. The same question, same corpus, two packet sizes:
#
#   seat                       size   full packet (~30k)   focused (~6k)
#   Qwen3.8-27B Q4_K_M        18.8GB  correct, 406s cold   correct, 112s/55s
#   glm-4.7-flash Q4_K_M      ~19 GB  WRONG                correct,  28s/14s
#   qwen3.5-abliterated 9B     6.6GB  not tested           correct,  49s/23s
#   granite4.1:8b              5.3GB  not tested           wrong
#   qwen3-vl:8b                6.1GB  not tested           wrong
#   Foundation-Sec-8B-Reason   8.5GB  not tested           wrong (backwards)
#
# The discriminator: asked whether a 30-day evaluation cycle is stricter than
# the 35 days CIP-007-6 R2 Part 2.2 allows, a seat had to notice that the
# operator's PROCEDURE says "thirty-five (35)" while the operator's NOTE claims
# thirty. On the 30k packet that sentence is one of 239 sections and glm missed
# it; on the 6k packet it read it correctly. The packet size was the failure,
# not the parameter count — which is why focusing the packet buys more than
# buying a bigger model.

# Focused profiles (intent / conformance / audit / timeline). Fast enough to
# hold a conversation in: 14-28 s per exchange warm.
# The full ~30k neighbourhood. The only seat measured correct at that size: it
# was the one that read the operator's own procedure instead of accepting the
# note's summary of it.
# Minimum footprint, for a host with less headroom. 6.6 GB, correct on the
# discriminator, 23 s warm.
