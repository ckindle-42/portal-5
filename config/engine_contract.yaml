# Pick small, installed models. Each role needs the capability it names:
#   thinking_tools : thinking-capable AND tool-capable (think both ways, tools parity)
#   non_thinking   : no thinking capability (think must be omitted, never 400)
#   vision         : image input (multi-part content parity)
