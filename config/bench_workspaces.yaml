  bench-qwen38-cad:
    module: eval
    name: 🔬 Bench · Qwen3.8-27B Dense (CAD challenger)
    description: |-
      TASK_CAD_ARM_REDEVELOP_V1 dense challenger: the redeveloped auto-cad tool loop (generate_part +
      cad_* build123d BREP tools) on Qwen3.8-27B dense (the seated compliance tag, ctx32k) instead of
      the qwen3-coder MoE incumbent. PROMOTE_POLICY=confirm — nothing here promotes a model.
    model_hint: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k
    # The compliance seat's live production tag for this model — real track record, not a fresh bake.
    ctx_validated: true
    context_limit: 32768  # 2026-10-06: fixed overhead (system+20 tool schemas) measured 5193 tok = 31.7% of 16384
    predict_limit: 16384
    # SEAT_CARD_CONFORMANCE_FIX: qwen3.8 instruct card values (settings_audit served_vs_card)
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 1.5
    # think=false matches this model's proven seats. 2026-10-06 pipeline preflight, 6x "40x20x5
    # plate with two 4 mm holes" under auto: 6/6 valid tool names, none hallucinated; 2/6 went
    # straight to a build (generate_part/cad_*) and delivered, 4/6 opened with cad_find_holes on
    # an empty session (premature inspect, not a hallucination) — the gauntlet measures whether
    # that costs it. See reports/cad/TASK_CAD_ARM_REDEVELOP_V1_REPORT.md.
    think: false
    tool_choice: auto
    tool_choice_verified: true
    system_prompt_append: |2-


      CAD OUTPUT RULE: You design parts as exact BREP solids with build123d. Units mm, right-handed, Z-up (width=X, depth=Y, height=Z; plate thickness is height). PATH 1 — box/plate/cylinder parts whose features are holes (incl. chamfer/counterbore/countersink), pockets, standoffs, ribs, shells, linear/circular patterns, edge fillets or chamfers: call generate_part with feature-level JSON (a base plus named features positioned by face + anchor + offset; never compute 3D coordinates — the emitter owns them). It builds, validates and delivers STEP+STL in one call; on error read the structured error and call it again corrected. PATH 2 — anything else (L-brackets and multi-body unions, revolved parts, gears, lofts, sweeps, threads): write ONE complete build123d script and call cad_build. Script rules: start `from build123d import *`; parameters as named variables at the top; algebra mode, e.g. `part = Box(80, 50, 5) - Pos(32, 17) * Cylinder(2.5, 5)`; Box/Cylinder are centred unless `align=(Align.CENTER, Align.CENTER, Align.MIN)`; `fillet(part.edges().filter_by(Axis.Z), r)` / `chamfer(edges, d)` take selected edges; revolve: `revolve(make_face(Plane.XZ * Polyline(p1, p2, ..., close=True)), Axis.Z)`; prisms: `extrude(RegularPolygon(r, 6), h)`; fastener holes: `Pos(x, y, top_z) * CounterSinkHole(radius, counter_sink_radius, depth=d)` or `CounterBoreHole`/`Hole`; gears: `from bd_warehouse.gear import SpurGear`; end with `show(part, 'part')`. If cad_build returns ok:false, read error, last_error and repair_hints, fix the script and call cad_build again (cad_execute appends code to the current session for small edits). VERIFY before delivering: compare cad_measure bbox/volume and cad_find_holes count/diameters against every number in the request; fix mismatches. DELIVER with cad_finalize (basename = short part name) and report the overall dimensions plus the step_url, stl_url and png_url. Use render_openscad only when the user explicitly asks for OpenSCAD/.scad; use execute_python+trimesh only for procedural meshes (lattices, TPMS) that BREP cannot express. Do not leave stubs.
    tools:
    - execute_python
    - execute_bash
    - sandbox_status
    - read_pdf
    - read_word_document
    - web_search
