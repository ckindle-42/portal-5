# config/security/hunt.yaml -- Defensive Bully LOOP operator dials.
#
# Loaded by portal/modules/security/core/bully/config.py::load_hunt_config.
# A per-hunt frozen snapshot is taken at authorization time (HuntConfigSnapshot);
# later edits here never retroactively change a running/closed hunt.
#
# coding_task/bully/tasks/TASK_BULLY_P1_SPINE_V1.md P1.0 step 4.

budgets:
  max_iterations: 20
  max_wall_clock_seconds: 14400   # 4h
  max_lab_actions: 60

mutation:
  # MUT lands in P3 (bully/mutation.py). max_variants_per_iteration is I-20's
  # per-hunt budget ceiling. allowed_classes is the operator-confirmed subset
  # of the code-level MUTATION_OPERATORS catalog (contracts.py) a hunt may
  # actually compile -- the initial baseline below is this landing's
  # operator confirmation; a class outside it requires a plan-level
  # approval_ref (mutation-class widening `[GATE]`, I-1).
  max_variants_per_iteration: 5
  allowed_classes:
    - REORDER_STEPS
    - SUBSTITUTE_TECHNIQUE
    - VARY_PARAMETER
    - INJECT_EVASION_DIRECTIVE
    - OFF_SCRIPT_SUPPLY
    - REVERSE_GEN_SEED

promote_policy: confirm            # promotion always requires an authenticated operator (MASTER SS7)

council:
  # HEART (P2) floors; declared here so config.py's schema is stable across phases.
  min_participation: 0.6
  materiality_categories:
    - evidence_contradiction
    - covering_detection_id
    - benign_counter_evidence
    - scope_safety
    - reproducibility
    - telemetry_health
    - relationship_classification
    - defense_response
    - analyst_visibility
    - regression_risk

thresholds:
  # Cousin-engine (BR-COUSIN) two-axis grading thresholds; calibration
  # artifact pointer is a config-versioned string, not a magic number.
  calibration_artifact: "bully-cousin-thresholds-v1"
  relationship:
    same_max_distance: 0.05
    similar_max_distance: 0.40
    new_max_distance: 0.85
  min_nonsemantic_channels_for_similar_or_new: 2

models:
  # Role-alias resolution mirrors the blueteam-council/blueteam-orchestrated
  # precedent (config/portal.yaml): every role tag is a workspace field
  # lookup at call time, never a literal model name in Python (MASTER SS11).
  # blueteam-orchestrated holds exactly the tool/reasoning/expert trio the
  # investigation arm's _run_three_section expects.
  workspace: blueteam-orchestrated
  role_fields:
    tool: tool_model
    reasoning: reasoning_model
    expert: expert_model
  # Council seat roster (HEART, P2) resolves from a separate workspace since
  # it is a list of models, not a single trio -- declared here so the
  # config shape doesn't change again when P2 lands.
  council_workspace: blueteam-council
  council_field: council_models

recall:
  mandatory: true                  # no code path may target without a persisted RecallReceipt
  default_k: 8

shadow:
  # Every dual-run/shadow interface defaults off (MASTER SS6).
  episode_dual_write: "off"        # off | shadow | authoritative
  cousin_dual_run: "off"           # off | shadow | authoritative
