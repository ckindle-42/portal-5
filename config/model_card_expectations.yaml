    behavioral_quirks:
      - "harmony format BREAKS under API 'format':'json' + think:false — returns empty/degenerate content (3-arm diagnostic, judgment 0.000 artifact). Use native settings; think:true works; strict-JSON tasks need the full council system prompt (abbreviated prompts degraded abstention)."
