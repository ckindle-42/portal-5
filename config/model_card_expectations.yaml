    recommended_sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, repeat_penalty: 1.05}
    prompt_contract: "Values are Qwen3-Coder-30B-A3B-Instruct's (non-thinking coder). Other qwen3 tags in this family (qwen3-vl) need their own card check."
  qwen3.5:
    status: verified-card
