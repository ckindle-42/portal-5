    prompt_contract: "Small sizes (0.8B-9B) default reasoning OFF per Unsloth; fine-tunes may override (MiMo-V2.6 enables thinking unless enable_thinking is false). repeat_penalty disabled or 1.0; presence_penalty is the recommended loop guard."
