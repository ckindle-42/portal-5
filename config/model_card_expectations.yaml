    recommended_sampling: {temperature: 1.0, top_p: 1.0}
    prompt_contract: "Harmony format; reasoning effort set in the system prompt (low/medium/high). generation_config.json sets no sampling; the README recommends temperature 1.0, top_p 1.0."
    max_context: {pending_research: true}
    tools: {pending_research: true}

