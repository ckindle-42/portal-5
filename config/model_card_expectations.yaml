# Model card ground-truth registry — WFE Phase 0 research artifact
#
# Purpose: the settings auditor can only verify config-vs-config consistency.
# This file is the config-vs-MODEL layer: what the card/manufacturer recommends
# vs what our tags actually bake. Entries are keyed by model FAMILY (apply to
# all tags whose name contains the family key, most-specific tag key wins).
#
# Field contract (per entry):
#   recommended_sampling : card's preferred inference settings (exact values)
#   max_context          : the context window the model actually supports (card)
#   tools                : card-claimed native tool/function support
#   template_source      : where a KNOWN-GOOD chat template comes from, when the
#                          stock Ollama template is suspect
#   known_good_template_sha : sha256[:12] of a template captured from a run that
#                          PASSED behavioral probes (system-honored + JSON + no
#                          think-leak) on this machine — the diff target
#   behavioral_quirks    : failure modes proven in testing (not folklore)
#   prompt_contract      : the prompt/system/output shape the model was trained on (for
#                          narrow specialists this decides whether a seat can use it at all)
#   recommended_sampling_modes : per-mode card values when the card gives several;
#                          recommended_sampling holds the mode the auditor checks
#   recommended_max_output : card-documented maximum output tokens for a thinking
#                          model — a single-cap seat serves reasoning AND answer
#                          from one budget, so this is what the seat's predict_limit
#                          should fit (settings_audit reasoning_budget_fit). Absent
#                          when the card documents no number; the citing card text
#                          lives in the comment above each field.
#   thinking_budget_levels : card-documented think-level token limits; Ollama uses
#                          the nearest level only when these limits are present.
#   verified             : true only when source URL + date are recorded below
#   harness_policy       : how the WFE harness must drive this family —
#       think: 'default' | 'true' | 'false'  (api endpoint only; v1 has no knob)
#       format_json_safe: bool               (false = format:json corrupts output)
#       notes: known harness conflicts proven in testing
#
# HONESTY RULE: an entry without a source URL is research debt, not ground
# truth. The auditor reports coverage of this file as WFE-0.6 progress.
#
# HARNESS RULE: every thinking-capable family needs harness_policy.think set
# before WFE runs it (qwen3*, deepseek-r1, glm z1, phi4-reasoning...). The
# runner refuses 'default' silently — it resolves policy and records the
# resolved dimensions in every result row. Sept-6/7 bench results were
# collected via /api/chat NON-streaming with think:false where the probe
# hardcoded it — an instrument caveat when comparing against production
# /v1 serving.

