    source: "https://unsloth.ai/docs/models/qwen3.5 (2026-09-24)"
    recommended_sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, presence_penalty: 1.5}
    recommended_sampling_modes:
      thinking_general: {temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 1.5}
      thinking_precise_coding: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0}
      instruct_general: {temperature: 0.7, top_p: 0.8, top_k: 20, presence_penalty: 1.5}
