    status: wiring-verified
    behavioral_quirks:
      - "CASE-SENSITIVE TAG: installed spelling is ':q4_K_M-ctx8k' (lowercase q) — every config reference must use the installed case (three personas had silent 404s)."
      - "rejected for compliance council: abstain-recall 0.25 (Sept-6 sweep) — lane-specific, not global."
    verified: wiring-only
    recommended_sampling: {pending_research: true}
    max_context: {pending_research: true}

