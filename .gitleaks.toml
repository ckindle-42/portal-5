# Extends gitleaks default ruleset; only adds an allowlist for known test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Portal 5 known non-secrets (test fixtures, placeholders)"
regexes = [
  '''sk-abcdefghijklmnopqrstuvwx''',   # dummy key in redaction unit test
  '''PIPELINE_API_KEY=mykey''',         # usage example in smoke_stream.sh
  '''CHANGEME''',                       # .env.example placeholder
  '''tomcat:tomcat''',                  # vulhub's own documented default Tomcat Manager weak creds (lab target, not a secret)
  '''admin:admin''',                    # Jenkins' own documented default weak creds (lab target red-prompt example, not a secret)
  '''axis2:axis2''',                    # Apache Axis2's own documented default admin weak creds (lab target red-prompt example, not a secret)
  '''vagrant:vagrant''',                # Metasploitable3's own documented default Windows account (lab target, not a secret)
  '''sploit:sploit''',                  # this meta3 box's actual Tomcat Manager creds, read from its own committed tomcat-users.xml over WinRM -- not a secret, a known weak lab credential
  '''http://\$TARGET_HOST/detail\.php\?id=1''', # web_to_root capture recipe's sqlmap target URL -- curl-auth-user false-positives on sqlmap's own -u <url> flag, not a curl -u user:pass credential
]
paths = [
  '''\.env\.example$''',
  '''config/searxng/settings\.yml\.new$''',  # vendored upstream example config
  '''portal/modules/security/core/results/.*\.json$''',   # generated bench output; prompt_key values (e.g. eternalblue_ms17010) trip generic-api-key on entropy
  '''portal/modules/security/core/field_journal/.*\.json$''',  # same prompt_key field, journal copy
  '''tests/benchmarks/bench_lab_exec\.py$''',  # lab-target-only constants (ADMIN_PASS, tomcat:tomcat weak creds) — live pentest lab, not real secrets
]
