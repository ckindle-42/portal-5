# Test gate for Portal 5.
#
# Runs the whole pytest suite (tests/ and portal/) on every PR and on push to
# main. Unlike persona_matrix_nightly.yml, this workflow does NOT need a
# self-hosted runner — the suite enforces an offline boundary in conftest.

name: unit-tests

on:
  pull_request:
    paths:
      - "portal/**"
      - "portal_mcp/**"
      - "portal_channels/**"
      - "tests/**"
      - "config/**.yaml"
      - "config/**.md"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/unit-tests.yml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # doc_ledger.py's freshness check (test_spine_gates.py::check_doc_currency)
          # resolves each doc's last_reconciled_commit via `git cat-file -e <sha>^{commit}`
          # and diffs bound sources since it — both need real history. actions/checkout's
          # default fetch-depth:1 only fetches the tip commit, so every historical stamp
          # resolves to "not found in history" and every doc reads stale. Reproduced by
          # cloning fresh with --depth 1 locally: `fatal: Not a valid object name <sha>`.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          # Install at uv.lock's versions so CI matches local runs (the vision suite's
          # committed PNG hashes depend on the exact Pillow/matplotlib rendering).
          uv export --frozen --extra dev --no-hashes --no-emit-project > /tmp/lock-constraints.txt
          pip install -e ".[dev]" -c /tmp/lock-constraints.txt

      - name: Complexity ceiling gate
        run: python scripts/complexity_report.py --gate

      - name: Run test suite
        run: pytest tests portal -n auto -x --tb=short -v

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-output
          path: .pytest_cache/
          retention-days: 7
