[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "portal/modules/security/tests"]
pythonpath = ["tests/benchmarks", "."]
asyncio_mode = "auto"
# -v: show each test name + PASSED/FAILED/ERROR as it runs (no dots)
# --tb=short: compact traceback on failures — enough to diagnose without wall of text
addopts = "-v --tb=short"
markers = [
    "browser: Playwright browser tests — require running frontends and 'playwright install chromium'",
    "timeout: Per-test timeout in seconds (decorative, enforced externally)",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
