[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portal-5"
version = "8.0.0"
description = "Portal 5 v8.0.0 — Open WebUI Enhancement Layer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
channels = [
    "python-telegram-bot>=20.7",
    "slack-bolt>=1.18.0",
]
notifications = [
    "aiosmtplib>=3.0.0",
    "APScheduler>=3.10.0",
]
mcp = [
    "mcp>=2.0.0,<3.0.0",
    "requests>=2.31.0",
    # Document generation
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "markdown>=3.6",
    # Audio — TTS (kokoro primary, fish-speech optional)
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.1",
    "huggingface_hub>=0.20.0",
    # Audio — transcription
    "faster-whisper>=1.0.0",
    # HTTP for ComfyUI/video bridge
    "httpx>=0.26.0",
]
generation = [
    # MusicGen via HuggingFace transformers — works on aarch64/MPS/CUDA/CPU.
    # AudioCraft removed: torchtext/xformers have no aarch64 Linux wheels.
    # music_mcp runs natively on macOS (MPS) via ./launch.sh install-music.
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0",
    "scipy>=1.11.0",
]
rag = [
    # MLX-native embeddings + reranking (Qwen3-Embedding/Reranker family)
    # Replaces sentence-transformers CPU path for Apple Silicon.
    "mlx-embeddings>=0.0.3",
]
bully = [
    # Defensive Bully ORG projection (bully/organ.py) -- embedded local
    # vector store, no server/port (MASTER: "never created by this build:
    # ... a second vector store"; this is a client library, not a service).
    "lancedb>=0.37.0",
]
apple-silicon = [
    # MLX dual-server: mlx-lm for text-only models, mlx-vlm for VLM models.
    # mlx-lm>=0.31 required: qwen3_next moved to mlx_vlm in 0.31+; stay current for
    # new model architectures (Laguna SWA, Mamba2, etc.) and thread-local stream fixes.
    "mlx-lm>=0.31",
    "mlx-vlm>=0.1.0",
    # MLX Speech: unified TTS (Kokoro + Qwen3-TTS) + ASR (Qwen3-ASR) on Apple Silicon
    "mlx-audio>=0.3.0",
    # MLX Transcribe: diarized transcription on Apple Silicon (TASK-TRANSCRIBE-001)
    # mlx-whisper emits Whisper-format segments with timestamps (Metal-accelerated)
    # pyannote.audio runs on MPS via PyTorch; HF token required for gated models
    "mlx-whisper>=0.4.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    # Kokoro TTS phonemizer dependencies (required by mlx-audio Kokoro backend)
    "misaki>=0.1.0",
    "num2words>=0.5.0",
    "spacy>=3.5.0",
    "phonemizer>=3.2.0",
]
dev = [
    "mcp>=2.0.0,<3.0.0",
    "promptfoo>=0.1.4",    # PyPI wrapper around the promptfoo Node CLI (dev-only LLM quality evals)
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "lancedb>=0.37.0",     # bully/organ.py's ORG projection -- needed to run tests/security/bully/
]

[project.scripts]
portal-pipeline = "portal.platform.inference.__main__:main"
portal = "portal.platform.inference.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["portal_channels", "portal_mcp", "portal", "portal_wiki"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "C90", "PLR0912", "PLR0915"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
