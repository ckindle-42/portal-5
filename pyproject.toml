"portal/platform/inference/router_pipe.py" = ["N806", "SIM117"]
# scripts/ — standalone operator scripts, pre-existing patterns (not package code)
"scripts/**/*.py" = ["E402", "F841", "B007", "B904", "C408", "SIM105", "SIM102"]
# portal_mcp — MCP SDK imports after logging setup (E402 is intentional guard ordering)
"portal_mcp/**/*.py" = ["E402", "SIM105"]
# MCP tool servers relocated into modules (BUILD_PROGRAM_MODULARIZATION_ALL_V1) —
