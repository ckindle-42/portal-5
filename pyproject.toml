[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portal-5"
version = "8.0.0"
description = "Portal 5 v8.0.0 — Open WebUI Enhancement Layer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
]

# ── Dependency policy (TASK_VL_RUNTIME_LANDING_V4) ───────────────────────────
# No upper bounds without a receipt: a `<` constraint needs (a) a linked upstream
#   issue or a reproducing failure and (b) a sunset version or date. A cap whose
#   stated reason is no longer true is a bug, not hygiene.
# Floors track reality: a floor exists to compel movement, not permit stagnation.
#   When a dependency moves, its floor moves with it.
# The lock must reproduce the runtime: a hand-patched venv is an outage waiting
#   for the next `uv sync`. Fix the lock, and keep the drift gate green.
[project.optional-dependencies]
channels = [
    "python-telegram-bot>=20.7",
    "slack-bolt>=1.18.0",
]
notifications = [
    "aiosmtplib>=3.0.0",
    "APScheduler>=3.10.0",
]
mcp = [
    # Cap receipt: MCP SDK v2 is the current major; v3 has no release and no
    # migration path yet. Sunset: re-evaluate when mcp 3.0.0 ships or 2026-12-31,
    # whichever is first.
    "mcp>=2.0.0,<3.0.0",
    "requests>=2.31.0",
    # Document generation
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "markdown>=3.6",
    # Audio — TTS. Cloning is Higgs Audio v2 via mlx-audio (host mlx-speech.py); Kokoro narration via mlx-audio.
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.1",
    "huggingface_hub>=1.9.1",
    # Audio — transcription
    "faster-whisper>=1.0.0",
    "httpx>=0.26.0",
    # ICS/OT passive protocol dissection (icsot module) — pure-Python; ships
    # scapy.contrib.modbus. Lazy-imported on first tool call.
    "scapy>=2.5.0",
    # Detection-as-code (detection module) — Sigma conversion + YARA. All
    # lazy-imported on first tool call.
    "pysigma>=0.11",
    "pysigma-backend-splunk>=1.1",
    "pysigma-backend-elasticsearch>=1.1",
    "pysigma-backend-kusto>=1.0",
    "yara-python>=4.5",
    # Data & analytics (data module) — DuckDB conversational analytics.
    # Lazy-imported on first tool call; pandas is already a transitive dep.
    "duckdb>=1.1",
    # Multimodal RAG (research module) — render PDF pages to images for the
    # Qwen3-VL retrieval server. Lazy-imported during kb_ingest.
    "pymupdf>=1.28.2",
]
generation = []
rag = [
    # MLX-native embeddings + reranking (Qwen3-Embedding/Reranker family)
    # Replaces sentence-transformers CPU path for Apple Silicon.
    # Floor 0.1.0: first release with the `qwen3_vl` module (multimodal VL
    # embedding + reranking). 0.0.x has no VL path.
    "mlx-embeddings>=0.1.0",
    # transformers 5.x gates `AutoImageProcessor` behind
    # `@requires(backends=("vision",))` where `vision` == torchvision; the
    # Qwen3-VL processor in mlx-embeddings imports models/qwen3_vl/processing_*.
    # Floor 5.16.1: taken deliberately (the working venv had 5.15.0) — the
    # qwen3_vl backend mapping is byte-identical across 5.14/5.15/5.16, so the
    # move is safe and keeps the lock current. See torchvision in apple-silicon.
    "transformers>=5.16.1",
]
bully = [
    # Defensive Bully ORG projection (bully/organ.py) -- embedded local
    # vector store, no server/port (MASTER: "never created by this build:
    # ... a second vector store"; this is a client library, not a service).
    "lancedb>=0.37.1",
]
apple-silicon = [
    # MLX dual-server: mlx-lm for text-only models, mlx-vlm for VLM models.
    # mlx-lm>=0.31 required: qwen3_next moved to mlx_vlm in 0.31+; stay current for
    # new model architectures (Laguna SWA, Mamba2, etc.) and thread-local stream fixes.
    "mlx-lm>=0.31.3",
    # Floor tracks the installed runtime (0.6.17). mlx-vlm carries the qwen3_vl
    # attention/rope code the VL retrieval server's `_reset_vl_state` works around.
    "mlx-vlm>=0.6.17",
    # mlx (core) is otherwise only a transitive dep. It is load-bearing for the
    # mxfp8 quant path and the qwen3_vl arch, so it gets an explicit floor that
    # tracks reality — nothing else stops a `uv sync` from walking it backwards.
    "mlx>=0.32.2",
    # MLX Speech: unified TTS (Kokoro + Qwen3-TTS + Higgs Audio v2 voice clone) + ASR (Qwen3-ASR) on Apple Silicon
    # 0.4.8 ships mlx_audio.vad (Sortformer diarization) alongside stt.
    # The `<0.5.0` cap is removed: its stated reason (avoid transformers>=5.16)
    # is void — 5.16.1 is already required by the qwen3_vl path (see `rag`), and
    # the transformers version is irrelevant to it. Floor is the version P5 verifies.
    "mlx-audio>=0.4.8",
    # MLX Transcribe: Parakeet-TDT-v3 transcript + Sortformer speaker diarization,
    # merged at word level on Apple Silicon (both native in mlx-audio, ungated —
    # no pyannote, no HF token). The non-Apple-Silicon fallback is faster-whisper
    # (base deps), which bundles its own CTranslate2 runtime — no mlx-whisper.
    "torch>=2.13.0",
    # torchaudio floor is deliberately below torch's: the working venv pairs
    # torchaudio 2.11.0 with torch 2.13.0 (mlx-audio's transcription path does
    # not exercise the version-coupled C-extension surface). Raise to 2.13.x
    # only with a verified mlx-audio run behind it.
    "torchaudio>=2.11.0",
    # torchvision: NOT used for inference — preprocessing runs on the PIL path
    # (`Qwen2VLImageProcessorPil`). It is required only to satisfy transformers 5.x's
    # class-level `@requires(backends=("vision",))` gate on `AutoImageProcessor`,
    # which the Qwen3-VL processor constructs. Pinned exact: torchvision 0.28.0
    # requires `torch==2.13.0` (verified on PyPI); a newer torchvision would drag
    # torch with it and buys nothing (PIL path). Sunset the pin when torch moves.
    "torchvision==0.28.0",
    # Reference-clip resampling for voice cloning (mlx-speech.py _voice_clone)
    "scipy>=1.10.0",
    # Kokoro TTS phonemizer dependencies (required by mlx-audio Kokoro backend)
    "misaki>=0.1.0",
    "num2words>=0.5.0",
    "spacy>=3.5.0",
    # Floor 3.4.0: 3.3.x's EspeakWrapper has no `set_data_path`, which
    # misaki.espeak (Kokoro phonemizer path) calls at import — a `uv sync` that
    # reverts phonemizer to 3.3.0 breaks all Kokoro TTS with
    # "type object 'EspeakWrapper' has no attribute 'set_data_path'".
    "phonemizer>=3.4.0",
    # spaCy English pipeline for misaki's G2P fallback — a GitHub-release wheel,
    # not on PyPI (URL in [tool.uv.sources]). Declared so `uv sync` keeps it
    # rather than uninstalling it and silently degrading Kokoro phonemization.
    "en-core-web-sm",
]
dev = [
    "mcp>=2.0.0,<3.0.0",  # cap receipt: see the `mcp` extra above
    "promptfoo>=0.1.4",    # PyPI wrapper around the promptfoo Node CLI (dev-only LLM quality evals)
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "lancedb>=0.37.1",     # bully/organ.py's ORG projection -- needed to run tests/security/bully/
]

[project.scripts]
portal-pipeline = "portal.platform.inference.__main__:main"
portal = "portal.platform.inference.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["portal_channels", "portal_mcp", "portal", "portal_wiki"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "C90", "PLR0912", "PLR0915"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
