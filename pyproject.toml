"tests/portal5_persona_matrix.py" = ["F401", "F841"]
"tests/benchmarks/bench_lab_exec.py" = ["SIM102"]
# tests/comfyui/runner.py: same deliberate C0, C1… section-identifier convention as the
# acceptance scripts above.
