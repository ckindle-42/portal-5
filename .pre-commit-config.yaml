# Portal 5 pre-commit hooks. Install once: pip install pre-commit && pre-commit install
# Run on all files ad hoc: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (block committed secrets)

  - repo: local
    hooks:
      # Ruff lint + format check
      - id: ruff-check
        name: ruff lint
        language: python
        entry: ruff check
        types: [python]
        args: [--fix]

      - id: ruff-format
        name: ruff format check
        language: python
        entry: ruff format --check
        types: [python]

      # Guard: full system validation — 74 checks (imports, routes, config,
      # wiki/fact-unit currency, security-bench subsystem integrity, etc).
      # Takes ~60s, so it runs at push time (not per-commit) and only when
      # a change actually touches the surface it checks.
      - id: validate-system
        name: system pre-flight (validate_system.py --skip-pytest)
        language: system
        entry: python3 scripts/validate_system.py --skip-pytest
        pass_filenames: false
        files: ^(portal/|config/|portal_wiki/|scripts/|deploy/|tests/)
        stages: [pre-push]

      # Guard: unit-test suite passes before commit. ~4-5min parallelized
      # (pytest-xdist, -n auto) on a 14-core M-series Mac vs ~8min serial;
      # blocks commits that break the test suite. Opt-in via
      # `pre-commit install`. Uses the developer's existing venv.
      - id: portal-config-validate
        name: validate config/portal.yaml
        language: system
        entry: python3 -m portal.platform.inference.cli config validate
        files: ^config/portal\.yaml$
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit suite
        language: system
        entry: pytest tests/unit -n auto -x --tb=short -q
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
