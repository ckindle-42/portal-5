# Portal 6.0.3 — Complete Stack
# Usage: ./launch.sh up  (from repo root — NEVER run docker compose directly)
# Secrets are auto-generated by launch.sh on first run.
# Running docker compose up directly without a .env will fail with missing vars.

services:

  # ── Ollama — Local LLM inference (opt-in, native is default) ─────────────
  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: portal5-ollama
    restart: unless-stopped
    profiles:
      - docker-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}     # 4 concurrent LLM requests
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}  # router + 2 inference models
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-25}           # Queue up to 25 requests
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1} # ~20-30% KV-cache reduction on Metal/CUDA
    # P7: Memory limits prevent runaway model loads from crashing other services.
    # OLLAMA_MEMORY_LIMIT defaults to 0 (unlimited) since model sizes vary.
    # Set OLLAMA_MEMORY_LIMIT=48g in .env to cap VRAM/RAM at 48 GB.
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 10

  # ── Ollama Init — pulls models on first run (opt-in, native is default) ───
  ollama-init:
    image: ollama/ollama:latest
    container_name: portal5-ollama-init
    restart: "no"
    profiles:
      - docker-ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    command: >
      sh -c "
        echo '=== Portal 5: Pulling core models ===' &&
        ollama pull ${DEFAULT_MODEL:-dolphin-llama3:8b} &&
        ollama pull hf.co/QuantFactory/Llama-3.2-3B-Instruct-abliterated-GGUF &&
        ollama pull nomic-embed-text:latest &&
        echo '=== Core models ready ===' &&
        echo 'Run: ./launch.sh pull-models  to pull all specialized models'
      "

  # ── Portal Pipeline — Intelligent Router ─────────────────────────────────
  portal-pipeline:
    build:
      context: ../..
      dockerfile: Dockerfile.pipeline
    container_name: portal5-pipeline
    restart: unless-stopped
    ports:
      - "0.0.0.0:9099:9099"
    volumes:
      - ../../config/backends.yaml:/app/config/backends.yaml:ro
      # portal_wiki/canonical/ was never reachable from this container at all
      # (not baked into the image, not previously mounted) — module.py's Gate
      # 4 (workspace-disabled-by-module check) reads module enable/disable
      # state from wiki units here via load_unit(), so without this mount it
      # silently and permanently falls back to DEFAULT_ENABLED_MODULES
      # (everything except eval) regardless of what `portal module enable`
      # does on the host. Found live 2026-07-17 testing blue/purple bench
      # dispatch for the first time since the modular refactor — every
      # bench-* synthetic workspace 404'd as "module not enabled" no matter
      # what the CLI reported. Read-only: the pipeline only ever reads gate
      # state, module toggles are written host-side via the CLI/git.
      - ../../portal_wiki/canonical:/app/portal_wiki/canonical:ro
      - type: tmpfs
        target: /tmp/portal_metrics
        tmpfs:
          size: 10485760
      - type: tmpfs
        target: /tmp/portal_traces
        tmpfs:
          size: 33554432
      - pipeline-metrics-state:/app/data
    environment:
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - OMLX_API_KEY=${OMLX_API_KEY:-}
      - MEMORY_GATE_MIN_FREE_GB=${MEMORY_GATE_MIN_FREE_GB:-1.5}
      - PIPELINE_WORKERS=${PIPELINE_WORKERS:-2}
      - PIPELINE_PORT=9099
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-20}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/portal_metrics
      # Was also missing this passthrough — startup hint validation has no
      # per-workspace exception, so enabling eval (60 bench-* workspaces) for
      # the first time since the modular refactor exposed 41 stale model
      # hints (candidate models from past evaluation rounds, never registered
      # in backends.yaml). Real fix is cleaning up those 41 hints or removing
      # workspaces for models no longer in the catalog — tracked separately,
      # not blocking this test. STRICT_HINT_VALIDATION defaults to true.
      - STRICT_HINT_VALIDATION=${STRICT_HINT_VALIDATION:-true}
      # eval module opt-in (Rule 6) — gates the per-model bench-* synthetic
      # workspaces blue/purple's resolve_pipeline_model() dispatches through.
      # Was missing entirely from this file (found live: every blue/purple
      # bench request 404'd with "Workspace 'bench-*' is disabled" regardless
      # of .env, since docker-compose never passed the var into the container
      # at all) — red-side dispatch never hit this since it uses raw Ollama
      # model IDs directly, bypassing workspace resolution.
      - PORTAL_ENABLE_EVAL=${PORTAL_ENABLE_EVAL:-false}
      # Turn trace — a var missing from this block never reaches the
      # container, which is how PORTAL_ENABLE_EVAL and STRICT_HINT_VALIDATION
      # above were each found silently inert during a live test.
      - PORTAL_TRACE=${PORTAL_TRACE:-1}
      - PORTAL_TRACE_BODIES=${PORTAL_TRACE_BODIES:-0}
      - PORTAL_TRACE_MAX=${PORTAL_TRACE_MAX:-200}
      - PORTAL_TRACE_MAX_BYTES=${PORTAL_TRACE_MAX_BYTES:-32768}
      - PORTAL_TRACE_DIR=/tmp/portal_traces
      # Notifications
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - SLACK_ALERT_WEBHOOK_URL=${SLACK_ALERT_WEBHOOK_URL:-}
      - SLACK_ALERT_CHANNEL=${SLACK_ALERT_CHANNEL:-#portal-alerts}
      - TELEGRAM_ALERT_BOT_TOKEN=${TELEGRAM_ALERT_BOT_TOKEN:-}
      - TELEGRAM_ALERT_CHANNEL_ID=${TELEGRAM_ALERT_CHANNEL_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-portal@portal.local}
      - EMAIL_ALERT_TO=${EMAIL_ALERT_TO:-}
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN:-}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:-}
      - ALERT_BACKEND_DOWN_THRESHOLD=${ALERT_BACKEND_DOWN_THRESHOLD:-3}
      - ALERT_NO_HEALTHY_BACKENDS=${ALERT_NO_HEALTHY_BACKENDS:-true}
      - ALERT_SUMMARY_ENABLED=${ALERT_SUMMARY_ENABLED:-true}
      - ALERT_SUMMARY_HOUR=${ALERT_SUMMARY_HOUR:-8}
      - ALERT_SUMMARY_TIMEZONE=${ALERT_SUMMARY_TIMEZONE:-America/Chicago}
      # LLM Router
      - LLM_ROUTER_ENABLED=${LLM_ROUTER_ENABLED:-true}
      - LLM_ROUTER_MODEL=${LLM_ROUTER_MODEL:-hf.co/QuantFactory/Llama-3.2-3B-Instruct-abliterated-GGUF}
      - LLM_ROUTER_CONFIDENCE_THRESHOLD=${LLM_ROUTER_CONFIDENCE_THRESHOLD:-0.5}
      - LLM_ROUTER_TIMEOUT_MS=${LLM_ROUTER_TIMEOUT_MS:-2000}
      - LLM_ROUTER_OLLAMA_URL=${LLM_ROUTER_OLLAMA_URL:-http://host.docker.internal:11434}
      - PORTAL5_TOOL_PRESELECT_MODEL=${PORTAL5_TOOL_PRESELECT_MODEL:-hf.co/openbmb/MiniCPM5-1B-GGUF:Q4_K_M}
      # Request tuning
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-4194304}
      - OLLAMA_KEEP_ALIVE_REQUEST=${OLLAMA_KEEP_ALIVE_REQUEST:--1}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-2048}
      - SHOW_ROUTING_STATUS=${SHOW_ROUTING_STATUS:-false}
      # MCP Tool server URLs (container-internal network — localhost doesn't resolve inside Docker)
      - MCP_DOCUMENTS_URL=http://portal5-mcp-documents:8913
      - MCP_EXECUTION_URL=http://portal5-mcp-sandbox:8914
      - MCP_SECURITY_URL=http://portal5-mcp-security:8919
      - MCP_MUSIC_MINIMAX_URL=http://host.docker.internal:8912
      - MCP_MFLUX_URL=http://host.docker.internal:8933
      - MCP_VIDEO_MLX_URL=http://host.docker.internal:8935
      - MCP_WHISPER_URL=http://portal5-mcp-whisper:8915
      - MCP_MLX_TRANSCRIBE_URL=http://host.docker.internal:8924
      - MCP_TTS_URL=http://portal5-mcp-tts:8916
      - MCP_RESEARCH_URL=http://portal5-mcp-research:8922
      - MCP_MEMORY_URL=http://portal5-mcp-memory:8920
      - MCP_RAG_URL=http://portal5-mcp-rag:8921
      - MCP_CAD_RENDER_URL=http://portal5-mcp-cad-render:8926
      - MCP_PIPELINE_URL=http://host.docker.internal:8928
      # Host-native security/knowledge MCPs — same host.docker.internal rule
      - MCP_MITRE_URL=http://host.docker.internal:8929
      - MCP_DETECTIONS_URL=http://host.docker.internal:8932
      - MCP_WIKI_URL=http://host.docker.internal:8931
      - MCP_VULNINTEL_URL=http://host.docker.internal:8934
      - MCP_ICSOT_URL=http://host.docker.internal:8936
      - MCP_COMPLIANCE_URL=http://host.docker.internal:8937
      - MCP_DETECTION_URL=http://host.docker.internal:8938
      - MCP_DATA_URL=http://host.docker.internal:8939
      - MCP_NETFORENSICS_URL=http://host.docker.internal:8941
      - TOOL_DISPATCH_TIMEOUT_S=${TOOL_DISPATCH_TIMEOUT_S:-180}
      - TOOL_REGISTRY_REFRESH_S=${TOOL_REGISTRY_REFRESH_S:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []
    # P7: CPU/memory limits keep the router isolated from noisy neighbours.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9099/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Open WebUI — Chat Interface ───────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: always
    container_name: portal5-open-webui
    restart: unless-stopped
    ports:
      # Default: localhost-only (127.0.0.1:8080).
      # Set ENABLE_REMOTE_ACCESS=true in .env to expose on all interfaces (0.0.0.0:8080).
      - "${WEBUI_LISTEN_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - open-webui-data:/app/backend/data
      # TASK-WORKSPACE-001: bind-mount uploads onto the named volume so
      # files dropped in chat are visible to MCPs at the same physical path.
      # The named volume retains everything else (database, RAG, config).
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}/uploads:/app/backend/data/uploads
    environment:
      # ── Model source ────────────────────────────────────────────────────────
      # Portal Pipeline is the SOLE model source — no direct Ollama access
      - OPENAI_API_BASE_URL=http://portal-pipeline:9099/v1
      - OPENAI_API_KEY=${PIPELINE_API_KEY}

      # ── API keys ────────────────────────────────────────────────────────────
      # Lets you mint an "sk-..." key (Settings -> Account) for OWUI_API_KEY, so
      # the media MCPs can publish generated files back through this server.
      - ENABLE_API_KEYS=true

      # ── Image generation — off in OWUI; Portal drives it via the mflux MCP
      # (generate_image / edit_image tools on the auto-image workspace), not
      # OWUI's built-in image button.
      - ENABLE_IMAGE_GENERATION=False

      # ── Web Search (SearXNG) ─────────────────────────────────────────────────
      # Web search is OFF in the running image (ENABLE_WEB_SEARCH=False). The former
      # RAG_WEB_SEARCH_* names are not read by this image; the live names are
      # WEB_SEARCH_*. Renaming them would turn web search on (G-OWUI decision).
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json&language=en

      # ── RAG / Knowledge Base ────────────────────────────────────────────────
      # EmbeddingGemma 2 on the host (:8946, OpenAI-compatible raw passthrough; launch.sh
      # starts it). host.docker.internal resolves to the host on macOS; host-gateway on Linux.
      # Engine/model/URL seed a fresh webui.db only; a live install persists them in the DB, so
      # change them with scripts/owui_reembed.py switch (the admin API), never by editing here.
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://host.docker.internal:8946/v1
      - RAG_OPENAI_API_KEY=portal-embedding
      - RAG_EMBEDDING_MODEL=google/embeddinggemma-2
      # Model-card SEARCH prefixes, env-only in Open WebUI (prepended as-is). They must equal
      # portal.platform.embedding.contract.format_text("", Task.SEARCH, role): pinned by
      # tests/unit/test_owui_eg2_prefixes.py.
      - "RAG_EMBEDDING_QUERY_PREFIX=task: search result | query: "
      - "RAG_EMBEDDING_CONTENT_PREFIX=title: none | text: "
      - ENABLE_RAG_LOCAL_WEB_FETCH=true
      # bge-reranker-v2-m3 (BAAI, cross-encoder reranker, ~0.6B)
      - RAG_RERANKING_MODEL=BAAI/bge-reranker-v2-m3
      - RAG_RERANKING_MODEL_TRUST_REMOTE_CODE=true
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=100
      - PDF_EXTRACT_IMAGES=true
      - ENABLE_RAG_HYBRID_SEARCH=true
      # bm25 weight 0.5 regressed dense-only 0.81 -> 0.64; 0.0-0.4 ties dense (EG2 followups R1)
      - RAG_HYBRID_BM25_WEIGHT=0.2

      # ── Cross-Session Memory ────────────────────────────────────────────────
      # (ENABLE_MEMORY_FEATURE / MEMORY_EMBEDDING_MODEL were unread by this image; the
      # image reads ENABLE_MEMORIES, whose effective value is unchanged by this removal.)

      # ── Authentication & Session Security ───────────────────────────────────
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_SESSION_COOKIE_SAME_SITE=lax
      - WEBUI_SESSION_COOKIE_SECURE=false  # Set to true when behind HTTPS proxy
      - JWT_EXPIRES_IN=24h                 # Session duration

      # ── User Registration & Roles ────────────────────────────────────────────
      # new signups require admin approval before they can use the system
      # Admin approves at: Admin Panel > Users > set role to 'user'
      # To allow immediate access: change to DEFAULT_USER_ROLE=user
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=pending
      - ENABLE_LOGIN_FORM=true

      # ── User Permissions ────────────────────────────────────────────────────
      # (USER_PERMISSIONS_CHAT_DELETION/EDITING were unread by this image; removed.)
      # Users cannot share chats publicly or access admin features
      - ENABLE_COMMUNITY_SHARING=false

      # ── Admin Controls ───────────────────────────────────────────────────────
      # Admin can view all users' chats for moderation/support
      - ENABLE_ADMIN_CHAT_ACCESS=true
      - ENABLE_ADMIN_EXPORT=true

      # ── Features ────────────────────────────────────────────────────────────
      - ENABLE_MESSAGE_RATING=true
      - ENABLE_CHANNELS=false         # Disable public channels (private chats only)
      - SAFE_MODE=false               # Allow full tool access for approved users

      # ── Speech (MLX-native on host via mlx-audio) ───────────────────────────
      # Primary: mlx-speech server on host (:8918) — Qwen3-TTS + Kokoro for TTS
      # TTS goes through mlx-speech. STT: measured 2026-10-07 on the running image —
      # an EMPTY AUDIO_STT_ENGINE is NOT "disabled"; it selects Open WebUI's built-in
      # local faster-whisper (model "base") with SUPPORTED_CONTENT_TYPES empty, so mic
      # input and audio uploads may be transcribed in-container. Portal's own
      # transcription is the transcribe_with_speakers MCP tool. Whether to repoint or
      # truly disable STT is the G-OWUI decision.
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=${MLX_SPEECH_URL:-http://host.docker.internal:8918}
      - AUDIO_TTS_OPENAI_API_KEY=portal-speech
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_heart
      - AUDIO_STT_ENGINE=${OWUI_AUDIO_STT_ENGINE:-}
      # ── Tool-call timeouts (TASK-OWUI-AUDIO-DROP-001) ──────────────────────
      # Default ~60s breaks any tool that takes longer (e.g., diarized
      # transcription on files >2min). 1800s = 30 min, enough for ~3-hour audio.
      - AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT:-1800}
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER_DATA=${AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER_DATA:-1800}
      # ── Persistent secret for MCP tool encryption ──────────────────────────
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      portal-pipeline:
        condition: service_healthy
      searxng:
        condition: service_started
    # P7: Memory limit prevents Open WebUI from consuming unbounded RAM.
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Open WebUI Init — Auto-seeds on fresh volume ──────────────────────────
  openwebui-init:
    image: python:3.11-slim
    container_name: portal5-init
    restart: "no"
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - OPENWEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL:-admin@portal.local}
      - OPENWEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
    volumes:
      - ../../scripts:/scripts:ro
      - ../../imports:/imports:ro
      - ../../config/personas:/personas:ro
      - ../../config/portal.yaml:/config/portal.yaml:ro
      - ../../portal/modules/eval/persona_matrix/prompts:/persona_prompts:ro
    command: >
      sh -c "pip install httpx pyyaml --quiet && python /scripts/openwebui_init.py"

  # ── MCP: Document Generation (Word, PowerPoint, Excel) ───────────────────
  mcp-documents:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-documents
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCUMENTS_HOST_PORT:-8913}:8913"
    environment:
      - DOCUMENTS_MCP_PORT=8913
      - MCP_PORT=8913
      - OUTPUT_DIR=/app/data/generated
      # Generated files are handed back via Open WebUI's files API (:8080).
      - OPENWEBUI_URL=http://open-webui:8080
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
    command: ["python", "-m", "portal.modules.documents.tools.document_mcp"]
    volumes:
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/app/data/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8913/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── MCP: Text-to-Speech (Kokoro / Fish Speech) ────────────────────────────
  mcp-tts:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TTS_HOST_PORT:-8916}:8916"
    environment:
      - TTS_MCP_PORT=8916
      - MCP_PORT=8916
      # tts_mcp proxies all tools to the host mlx-speech.py server (voice clone,
      # trainer profiles, Kokoro) — the same host hop OWUI's built-in TTS uses.
      - MLX_SPEECH_URL=${MLX_SPEECH_URL:-http://host.docker.internal:8918}
      # Generated audio is published through Open WebUI's files API so the
      # download link rides :8080 (the only tunnel-exposed port).
      - OPENWEBUI_URL=http://open-webui:8080
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
      - TTS_BACKEND=${TTS_BACKEND:-kokoro}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-af_heart}
      - OUTPUT_DIR=/app/data/generated
      # Shared workspace so register_voice/clone_voice can resolve an OWUI upload
      # to bytes and forward them to the host (the container fs is not the host's).
      - WORKSPACE_DIR=/workspace
      - HF_HOME=/app/data/hf_cache
      - HF_TOKEN=${HF_TOKEN:-}
    command: ["python", "-m", "portal.modules.media.tools.tts_mcp"]
    volumes:
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/app/data/generated
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/workspace
      - portal5-hf-cache:/app/data/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8916/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # ── MCP: Whisper Transcription ────────────────────────────────────────────
  mcp-whisper:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHISPER_HOST_PORT:-8915}:8915"
    environment:
      - WHISPER_MCP_PORT=8915
      - MCP_PORT=8915
      - HF_HOME=/app/data/hf_cache
      - HF_TOKEN=${HF_TOKEN:-}
      - WORKSPACE_DIR=/workspace
      # Transcript files are handed back via Open WebUI's files API (:8080).
      - OPENWEBUI_URL=http://open-webui:8080
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
    command: ["python", "-m", "portal.modules.media.tools.whisper_mcp"]
    volumes:
      - portal5-hf-cache:/app/data/hf_cache
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8915/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Docker-in-Docker (isolated execution environment for code sandbox) ──────
  dind:
    # docker:dind-rootless requires kernel user-namespace support unavailable in
    # Docker Desktop's LinuxKit VM on macOS. On macOS the Desktop VM already
    # provides the isolation boundary, so privileged DinD is acceptable here.
    # On bare-metal Linux hosts you can switch to docker:27-dind-rootless +
    # seccomp:unconfined + apparmor:unconfined + tmpfs /run/user/1000.
    build:
      context: ../..
      dockerfile: Dockerfile.dind
    image: portal5-dind:latest
    pull_policy: never
    container_name: portal5-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=        # Disable TLS — internal network only
    volumes:
      - dind-storage:/var/lib/docker
      - sandbox-work:/app/data/sandbox  # Shared with mcp-sandbox for code files
      # Read-only vulhub clone, bind-mounted into DinD's own filesystem so
      # `docker run -v /vulhub-src:/vulhub:ro` (issued by mcp-sandbox against
      # this DOCKER_HOST) has a source path that actually exists on the daemon
      # side -- DinD bind-mount sources resolve against the daemon's fs, not
      # the client (mcp-sandbox) container's. See code_sandbox_mcp.py.
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}/lab/vulhub:/vulhub-src:ro
      # Shared workspace, read-only, so execute_python can open the user's files
      # (same DinD-side bind-mount rationale as vulhub; see code_sandbox_mcp.py).
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/workspace-src:ro
      # Binary research projects root, bind-mounted into DinD read-write so
      # `docker run -v /binresearch-projects/<name>:/work` (issued by the
      # binresearch MCP) resolves on the daemon fs. Same rationale as vulhub.
      - ${BINRESEARCH_PROJECTS_ROOT:-${HOME}/binresearch}:/binresearch-projects:rw
    # P7: Resource limits prevent DinD from consuming all system RAM/CPU.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

    # ── MCP: Code Execution Sandbox ───────────────────────────────────────────
  mcp-sandbox:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SANDBOX_HOST_PORT:-8914}:8914"
    environment:
      - SANDBOX_MCP_PORT=8914
      - MCP_PORT=8914
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-30}
      - SANDBOX_ENABLED=true
      # Files the code writes to /out are handed back via Open WebUI's files API.
      - OPENWEBUI_URL=http://open-webui:8080
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
      - SANDBOX_DIR=/app/data/sandbox
      # Point at DinD instead of host Docker
      - DOCKER_HOST=tcp://dind:2375
      - WORKSPACE_DIR=/workspace
      - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-false}
      - SANDBOX_DOCKER_IMAGE=${SANDBOX_DOCKER_IMAGE:-portal5-sandbox-data:latest}
      # Lab-exec lane — live *-exec workspaces against a routable remote lab.
      # Off by default; set these in .env to enable. See docs/LAB_SETUP.md.
      - SANDBOX_LAB_EXEC=${SANDBOX_LAB_EXEC:-false}
      - SANDBOX_LAB_IMAGE=${SANDBOX_LAB_IMAGE:-}
      - SANDBOX_LAB_MEMORY=${SANDBOX_LAB_MEMORY:-2g}
      - SANDBOX_LAB_CPUS=${SANDBOX_LAB_CPUS:-2.0}
      - SANDBOX_LAB_TIMEOUT_MAX=${SANDBOX_LAB_TIMEOUT_MAX:-600}
      - LAB_TARGET_NETWORK=${LAB_TARGET_NETWORK:-}
      - LAB_TARGET_DC=${LAB_TARGET_DC:-}
      - LAB_TARGET_WS=${LAB_TARGET_WS:-}
      - LAB_TARGET_SRV=${LAB_TARGET_SRV:-}
    # Run as root to chown shared volume on startup, then drop to portal
    user: root
    entrypoint: ["sh", "-c", "chown portal:portal /app/data/sandbox 2>/dev/null; exec su portal -c 'python -m portal.modules.coding.tools.code_sandbox_mcp'"]
    depends_on:
      dind:
        condition: service_healthy
    volumes:
      - sandbox-work:/app/data/sandbox  # Shared with dind for code execution
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8914/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # NO docker.sock mount

  # ── MCP: Binary Research toolchain ────────────────────────────────────────
  # Owns portal5-binresearch (static-RE arsenal). The harness bash tool
  # (target=container) POSTs here; commands run in the container with the named
  # project mounted at /work. Build the image first: ./launch.sh build-binresearch
  mcp-binresearch:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-binresearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BINRESEARCH_MCP_HOST_PORT:-8930}:8930"
    environment:
      - BINRESEARCH_MCP_PORT=8930
      - MCP_PORT=8930
      - DOCKER_HOST=tcp://dind:2375
      - BINRESEARCH_IMAGE=${BINRESEARCH_IMAGE:-portal5-binresearch:latest}
      - BINRESEARCH_MEMORY=${BINRESEARCH_MEMORY:-4g}
      - BINRESEARCH_CPUS=${BINRESEARCH_CPUS:-2.0}
      - BINRESEARCH_TIMEOUT=${BINRESEARCH_TIMEOUT:-120}
      - BINRESEARCH_TIMEOUT_MAX=${BINRESEARCH_TIMEOUT_MAX:-600}
      - BINRESEARCH_JOBS_DIR=/binresearch-projects
    depends_on:
      dind:
        condition: service_healthy
    command: ["python", "-m", "portal.modules.binary_research.tools.binresearch_mcp"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8930/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── MCP: Proxmox VE Management ────────────────────────────────────────────
  # Full VM/LXC/snapshot/storage management via Proxmox REST API.
  # Auth: set PROXMOX_TOKEN_ID and PROXMOX_TOKEN_SECRET in .env.
  # Proxmox UI: Datacenter → Permissions → API Tokens → Add (role: PVEAdmin on /)
  mcp-proxmox:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-proxmox
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXMOX_MCP_HOST_PORT:-8927}:8927"
    environment:
      - PROXMOX_MCP_PORT=8927
      - MCP_PORT=8927
      - PROXMOX_URL=${PROXMOX_URL:-https://10.0.0.203:8006}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID:-}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET:-}
      - PROXMOX_VERIFY_SSL=${PROXMOX_VERIFY_SSL:-false}
      - PROXMOX_DEFAULT_NODE=${PROXMOX_DEFAULT_NODE:-}
      - PROXMOX_TASK_TIMEOUT=${PROXMOX_TASK_TIMEOUT:-120}
      # SSH exec (proxmox_node_exec / proxmox_container_exec — pct exec, docker ops,
      # host diagnostics). Key + known_hosts are mounted read-only below.
      - PROXMOX_SSH_KEY=/run/secrets/proxmox_ssh_key
      - PROXMOX_SSH_KNOWN_HOSTS=/run/secrets/proxmox_known_hosts
      - PROXMOX_SSH_USER=${PROXMOX_SSH_USER:-root}
    volumes:
      - ${PROXMOX_SSH_KEY:-~/.ssh/portal-lab_id_ed25519}:/run/secrets/proxmox_ssh_key:ro
      - ${HOME}/.ssh/known_hosts:/run/secrets/proxmox_known_hosts:ro
    command: ["python", "-m", "portal.modules.security.tools.proxmox_mcp"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8927/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── MCP: Security Tools (CVE severity classification) ──────────────────────
  mcp-security:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-security
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SECURITY_HOST_PORT:-8919}:8919"
    environment:
      - SECURITY_MCP_PORT=8919
      - MCP_PORT=8919
      - HF_HOME=/app/data/hf_cache
    command: ["python", "-m", "portal.modules.security.tools.security_mcp"]
    volumes:
      - security-hf-cache:/app/data/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8919/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # ── Browser MCP (Obscura) ──────────────────────────────────────────────────
  browser-mcp:
    build:
      context: ../..
      dockerfile: deploy/browser-mcp/Dockerfile
    container_name: portal5-browser
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BROWSER_MCP_HOST_PORT:-8923}:8923"
    volumes:
      - ${BROWSER_PROFILES_DIR:-/Volumes/data01/portal5_browser_profiles}:/profiles:rw
      - ${BROWSER_AUDIT_LOG:-/Volumes/data01/portal5_browser_audit.log}:/audit/audit.log:rw
    environment:
      - PLAYWRIGHT_MCP_BLOCKED_ORIGINS=${PLAYWRIGHT_MCP_BLOCKED_ORIGINS:-localhost;127.0.0.1;169.254.169.254;metadata.google.internal}
      - BROWSER_STEALTH=${BROWSER_STEALTH:-true}
      - PROFILES_DIR=/profiles
      - AUDIT_LOG_PATH=/audit/audit.log
      - BROWSER_MCP_PORT=8923
      - BROWSER_DOMAIN_RATE_LIMIT=${BROWSER_DOMAIN_RATE_LIMIT:-30}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8923/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Telegram Bot ─────────────────────────────────────────────────────────────
  # Enabled when TELEGRAM_BOT_TOKEN is set in .env
  # Get a token from @BotFather: https://t.me/BotFather
  portal-telegram:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-telegram
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://portal-pipeline:9099/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_USER_IDS=${TELEGRAM_USER_IDS:-}
      - PIPELINE_URL=http://portal-pipeline:9099
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - TELEGRAM_DEFAULT_WORKSPACE=${TELEGRAM_DEFAULT_WORKSPACE:-auto}
    command: ["python", "-m", "portal_channels.telegram.bot"]
    depends_on:
      portal-pipeline:
        condition: service_healthy
    profiles:
      - telegram

  # ── Slack Bot ─────────────────────────────────────────────────────────────────
  # Enabled when SLACK_BOT_TOKEN and SLACK_APP_TOKEN are set in .env
  # Create at: https://api.slack.com/apps — enable Socket Mode
  portal-slack:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-slack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://portal-pipeline:9099/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - PIPELINE_URL=http://portal-pipeline:9099
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - SLACK_DEFAULT_WORKSPACE=${SLACK_DEFAULT_WORKSPACE:-auto}
    command: ["python", "-m", "portal_channels.slack.bot"]
    depends_on:
      portal-pipeline:
        condition: service_healthy
    profiles:
      - slack

  # ── SearXNG — Self-hosted privacy-respecting web search ──────────────────
  searxng:
    image: searxng/searxng:latest
    pull_policy: always
    container_name: portal5-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ../../config/searxng:/etc/searxng:rw
      - searxng-data:/var/lib/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
      - INSTANCE_NAME=Portal5 Search
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── MCP: Research (web search, fetch, news) ──────────────────────────────
  mcp-research:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-research
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RESEARCH_MCP_HOST_PORT:-8922}:8922"
    environment:
      - RESEARCH_MCP_PORT=8922
      - MCP_PORT=8922
      - SEARXNG_URL=http://searxng:8080
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - WEB_SEARCH_PRIMARY=${WEB_SEARCH_PRIMARY:-}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-}
      # A2/A3 Obscura fallback tiers reach the browser MCP by its compose service name.
      - BROWSER_MCP_URL=${BROWSER_MCP_URL:-http://browser-mcp:8923}
    command: ["python", "-m", "portal.modules.research.tools.web_search_mcp"]
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8922/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── MCP: Memory (cross-conversation persistence) ─────────────────────────
  mcp-memory:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMORY_MCP_HOST_PORT:-8920}:8920"
    environment:
      - MEMORY_MCP_PORT=8920
      - MCP_PORT=8920
      - PORTAL5_LANCE_DIR=/app/data/portal5_lance
      - EG2_EMBEDDING_URL=${EG2_EMBEDDING_URL:-http://host.docker.internal:8946}
      - EG2_EXPECTED_MODEL=${EG2_EXPECTED_MODEL:-google/embeddinggemma-2}
      # temporal knowledge-graph memory: entity/relation extraction on write
      - OLLAMA_CHAT_URL=${OLLAMA_CHAT_URL:-http://portal-pipeline:9099/ollama/api/chat}
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - MEMORY_EXTRACT_MODEL=${MEMORY_EXTRACT_MODEL:-gemma4:e4b-it-qat-ctx8k}
    command: ["python", "-m", "portal.platform.memory.memory_mcp"]
    volumes:
      - portal5-lance:/app/data/portal5_lance
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8920/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── MCP: RAG (knowledge base retrieval) ──────────────────────────────────
  mcp-rag:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    container_name: portal5-mcp-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_MCP_HOST_PORT:-8921}:8921"
    environment:
      - RAG_MCP_PORT=8921
      - MCP_PORT=8921
      - PORTAL5_LANCE_DIR=/app/data/portal5_lance
      - PORTAL5_KB_SOURCES_DIR=/app/data/portal5_kb_sources
      # Retrieval embeds with EmbeddingGemma 2's VL-compatible surface (:8946/vl, 768d);
      # its /rerank forwards to the Qwen3-VL reranker on :8942.
      - VL_RETRIEVAL_URL=${VL_RETRIEVAL_URL:-http://host.docker.internal:8946/vl}
      - VL_EMBEDDING_DIM=${VL_EMBEDDING_DIM:-768}
      - RAG_RERANK_ENABLED=${RAG_RERANK_ENABLED:-true}
      - RAG_CANDIDATE_POOL_SIZE=${RAG_CANDIDATE_POOL_SIZE:-20}
      - RAG_TRANSCRIBE_MODEL=${RAG_TRANSCRIBE_MODEL:-qwen3-vl:4b-instruct-q4_K_M}
      - RAG_OLLAMA_URL=${RAG_OLLAMA_URL:-http://portal-pipeline:9099/ollama}
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
    command: ["python", "-m", "portal.modules.research.tools.rag_mcp"]
    volumes:
      - portal5-lance:/app/data/portal5_lance
      - portal5-kb-sources:/app/data/portal5_kb_sources
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8921/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mcp-cad-render:
    build:
      context: ../..
      dockerfile: Dockerfile.cad
    platform: linux/arm64
    container_name: portal5-mcp-cad-render
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAD_RENDER_HOST_PORT:-8926}:8926"
    environment:
      - CAD_RENDER_MCP_PORT=8926
      # Rendered previews + meshes are handed back via Open WebUI's files API (:8080).
      - OPENWEBUI_URL=http://open-webui:8080
      - OWUI_API_KEY=${OWUI_API_KEY:-}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
      - PYOPENGL_PLATFORM=osmesa
      - CAD_RENDER_REVIEW_LOOP=${CAD_RENDER_REVIEW_LOOP:-0}
      - CAD_RENDER_REVIEW_MODEL=${CAD_RENDER_REVIEW_MODEL:-qwen3-vl:32b}
      - PORTAL_PIPELINE_URL=http://portal5-pipeline:9099
      - WORKSPACE_DIR=/workspace
      - CAD_B3D_MAX_SESSIONS=${CAD_B3D_MAX_SESSIONS:-4}
      - CAD_B3D_IDLE_TIMEOUT_S=${CAD_B3D_IDLE_TIMEOUT_S:-900}
      - CAD_B3D_MEMORY_LIMIT_MB=${CAD_B3D_MEMORY_LIMIT_MB:-3072}
    command: ["python", "-m", "portal.modules.cad.tools.cad_render_mcp"]
    volumes:
      - ${AI_OUTPUT_DIR:-${HOME}/AI_Output}:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8926/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Prometheus — Metrics collection ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: portal5-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Grafana — Metrics dashboards ────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: portal5-grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama-models:       # Ollama model weights — survives docker compose down
  open-webui-data:     # Open WebUI database — wipe with ./launch.sh clean
  portal5-hf-cache:    # HuggingFace model cache (TTS, whisper)
  dind-storage:        # DinD persistent storage
  sandbox-work:        # Shared sandbox code files (mcp-sandbox ↔ dind)
  searxng-data:        # SearXNG data
  prometheus-data:     # Prometheus metrics data
  grafana-data:        # Grafana dashboards/data
  pipeline-metrics-state:  # Persistent metrics state (JSON, survives restarts)
  security-hf-cache:       # HuggingFace model cache for security MCP (CIRCL VLAI)
  portal5-lance:           # LanceDB vector storage (memory + RAG)
  portal5-kb-sources:      # Knowledge base source files for RAG ingestion
