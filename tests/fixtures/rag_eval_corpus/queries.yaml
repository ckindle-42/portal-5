     query: "What is the pressure span of PT-1401 on the deaerator trend group?"}
  # ── diagram-only · synthetic electrical / legend / table ──
  - {id: syn-ele-01, category: diagram_only, target_file: relay_settings_12l4.pdf, target_page: 1,
