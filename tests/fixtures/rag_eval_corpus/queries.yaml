     query: "The Plant B firewall allows inbound TCP 502 from which single source address?"}
  - {id: syn-net-03, category: diagram_only, target_file: control_center_arch.pdf, target_page: 1,
     query: "In the Purdue reference architecture, what address is assigned to the safety PLC at Level 1?"}
  - {id: syn-net-04, category: diagram_only, target_file: control_center_arch.pdf, target_page: 1,
     query: "Which host sits at 172.19.5.30 in the Level 3.5 DMZ?"}
  - {id: syn-net-05, category: diagram_only, target_file: control_center_arch.pdf, target_page: 1,
     query: "What device enforces the one-way path from the Level 3 historian to the 3.5 replica?"}
