# RAG retrieval evaluation query set (TASK_VL_RETRIEVAL_HARDENING_AND_CLOSEOUT_V2 P4).
# category: diagram_only | prose_only | mixed
# target_file: source PDF basename as ingested
# target_page: 0-indexed page whose retrieval counts as a hit; null = any page of the file
# For diagram_only synthetic docs the discriminating answer is ONLY on the
# rendered figure (page 1, 0-indexed) — page-1 prose is generic governance text.

queries:
  # ── diagram-only · synthetic P&ID (small text in figure) ──
  - {id: syn-pid-01, category: diagram_only, target_file: pid_reactor_feed.pdf, target_page: 1,
     query: "In the reactor feed loop, which control valve is air-to-open and fail-closed?"}
  - {id: syn-pid-02, category: diagram_only, target_file: pid_reactor_feed.pdf, target_page: 1,
     query: "What is the flow controller setpoint on the reactor feed, in gpm?"}
  - {id: syn-pid-03, category: diagram_only, target_file: pid_reactor_feed.pdf, target_page: 1,
     query: "Interlock I-3 trips which pump and closes which valve on a level high-high?"}
  - {id: syn-pid-04, category: diagram_only, target_file: pid_recycle_compressor.pdf, target_page: 1,
     query: "Which valve is the anti-surge valve on the K-501 recycle compressor?"}
  - {id: syn-pid-05, category: diagram_only, target_file: pid_recycle_compressor.pdf, target_page: 1,
     query: "At what pressure ratio does the compressor anti-surge valve open?"}
  - {id: syn-pid-06, category: diagram_only, target_file: pid_recycle_compressor.pdf, target_page: 1,
     query: "What is the tag of the check valve downstream of cooler E-506?"}
