# RAG eval corpus manifest — the PDFs are NOT committed. Assemble a corpus dir:
#   1. python <(sed -n '/^```python$/,/^```$/p' README.md | sed '1d;$d') <corpus_dir>   # synthetic
#   2. fetch the `public` entries below into <corpus_dir>
#   3. drop the operator `internal` docs into <corpus_dir> (or omit — they are distractor-only)
# then run scripts/rag_retrieval_eval.py against <corpus_dir>.

synthetic:
  builder: README.md   # 9 two-page figure docs; _index.json lists per-figure answer tokens

public:
