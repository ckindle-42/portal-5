  # NIST SP 800-82r3 — fetch full, then slice pages 25..116 (0-indexed) into the arch slice:
  #   pymupdf: out.insert_pdf(src, from_page=24, to_page=115); out.save("nist_800_82r3_arch_slice.pdf")
  - {file: nist_800_82r3_arch_slice.pdf, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf", slice: "24-115"}

internal:
  # Operator-provided OT/CIP procedure PDFs — distractor pressure only (no labelled queries
  # target them). Any ~9 prose-heavy OT compliance docs work; omitting them shrinks the
  # distractor set but does not change the query ground truth.
  note: "not fetchable; supply from your own document set"
