  - {file: cip-005-7.pdf,    url: "https://www.nerc.com/globalassets/standards/reliability-standards/cip/cip-005-7.pdf"}
  - {file: cip-006-6.pdf,    url: "https://www.nerc.com/globalassets/standards/reliability-standards/cip/cip-006-6.pdf"}
  - {file: cip-007-6.pdf,    url: "https://www.nerc.com/globalassets/standards/reliability-standards/cip/cip-007-6.pdf"}
  - {file: cip-008-6.pdf,    url: "https://www.nerc.com/globalassets/standards/reliability-standards/cip/cip-008-6.pdf"}
  - {file: cip-009-6.pdf,    url: "https://www.nerc.com/globalassets/standards/reliability-standards/cip/cip-009-6.pdf"}
