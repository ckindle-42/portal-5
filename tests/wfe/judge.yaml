# Default blind-pair judge for tests/wfe/judge.py, read when WFE_JUDGE_MODEL /
# WFE_JUDGE_URL are unset (env and --model/--url still override). The P40
# kat-coder seat scored best of 7 local judges, 76% agreement with operator
# labels (judge selection, 2026-10). Keep the model name here, never in Python.
url: http://10.0.0.204:11434
model: kat-coder-35b:code

profiles:
  cloud:
    # OpenAI-compatible endpoint for the cloud judge lane.
    # WFE_JUDGE_CLOUD_MODEL / WFE_JUDGE_CLOUD_URL override these;
    # api_key_env names the env var holding the bearer token.
    url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
  council:
    # Third member, asked only where local and cloud already disagree.
    # Local, and a different model from the kat-coder lane. A security suite
    # refuses this entry when it is a cloud URL and uses the local judge.
    third:
      url: http://10.0.0.204:11434
      model: qwen3.6-35b-a3b:q3code
