# Tool-result carry A/B. Eight realuse_v1 tasks where a later turn grades a fact
# from an earlier turn's tool result and the later user text does not restate it.
# Incumbent only, production seats, repeats 3: n=24 per condition.
#
# auto-daily: ru-v1-001 (misc supplies is not in the first answer check),
