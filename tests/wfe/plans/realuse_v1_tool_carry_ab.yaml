# auto-daily::fast: ru-v1-064 (Dana and Leo), ru-v1-069 (keep March 14).
# auto-documents: ru-v1-019 (Acme Supply and 1,240), ru-v1-028 (once a week
#   from birds.docx while turn 2 reads feeder.docx), ru-v1-070 (exam dates).
# For 004, 006, 028, 064, 069, and 070 the fact is also required in the earlier
