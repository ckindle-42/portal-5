# Seat sampling vs the model card's sampling, one arm each, on the seats carrying traffic
# (docs/TASK_SEAT_SAMPLING_AB_V1.md method; docs/TASK_SEAT_VENDOR_FIT_V1.md is the reference).
# The incumbent arm is the seat exactly as production serves it (pipeline mode sends no sampling
# and no think for an incumbent). The `card` arm is the SAME model with the card's own sampling:
# campaign._with_card_sampling fills `label: card` arms from config/model_card_expectations.yaml,
# picking the instruct or thinking arm from the lane's think policy, so no value here can drift
# from the registry. Both arms run the same suite at the same seeds (campaign sets seed=1000+repeat).
#
# Screen tier only: it is 12 tasks per arm at one repeat, and its advance list decides who earns
# a confirm run. One campaign, one report.
#   ./scripts/wfe_campaign.sh seat_card_screen_20261029 \
#       --plan tests/wfe/plans/seat_card_sampling_ab_20261029.yaml --tier screen --engine pipeline
workloads:
  auto-compliance:
    tool_mode: production
    home: compliance_production
    discovery: []
    arms:
      incumbent: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k
      challengers:
        - {model: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M-ctx32k, label: card}
