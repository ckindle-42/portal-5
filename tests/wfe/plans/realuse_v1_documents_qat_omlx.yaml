# Fair auto-documents A/B on oMLX at the seat's sampling (not card sampling). The 2026-11-06 same-engine
# screen scored QAT 30/32 and plain 31/32; the pooled campaigns tied 46/48. Both tags share the seat's
# 16k context_limit and real-use task set. A QAT win supports consolidating onto the existing fast build.
repeats: 4
workloads:
  auto-documents:
    tool_mode: production
    home: realuse_v1
    discovery: []
    arms:
      incumbent:
        model: gemma4:26b-a4b-it-q4_K_M-ctx32k
        label: seat-sampling
        sampling: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0.05}
      challengers:
        - model: gemma4:26b-a4b-it-qat-ctx32k
          label: seat-sampling
          sampling: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0.05}
