# S2 rerun of the laguna seat (docs/TASK_SEAT_SAMPLING_AB_V1.md, item B1).
# The 2026-09-25 A/B in docs/TASK_SEAT_VENDOR_FIT_V1.md is VOID: its seat arm
# ran with thinking forced off (production sends no think for this seat, so the
# model thinks) and with its repeat_penalty never reaching oMLX.
#
# Since 2026-09-25 (evening) the seat serves its CARD temperature/top_p/top_k
# (1.0/1.0/20) with its min_p/repeat_penalty loop guards kept. The incumbent is
# therefore the card configuration; the question is whether the prior 0.2/0.9/40
# config or thinking-off beats it. All arms are variants of ONE model in ONE
# campaign; each has its own run_ids, so nothing collides and a resume cannot
# mix them.
#
# Run through the pipeline, as users are served (it routes this seat to oMLX;
# preflight confirms the served model from the pipeline trace):
#   set -a; source .env; set +a
#   WFE_ENGINE=pipeline \
#     uv run python -m tests.wfe.campaign --plan tests/wfe/plans/s2_laguna_rerun_omlx.yaml \
#       --campaign-id s2_laguna_rerun_pipeline_v1 --debug-dir <dir>
workloads:
  auto-coding::laguna:
    home: coding
    discovery: [compliance_agentic]
    arms:
      # Arm A — the seat exactly as production serves it (sampling from
      # config/portal.yaml, no think field -> model default).
      incumbent: Laguna-XS-2.1-4bit
      challengers:
        # Arm B — the seat's pre-2026-09-25 sampling (an override REPLACES the
        # seat's keys, so the guards are restated).
        - model: Laguna-XS-2.1-4bit
          label: prior
          sampling: {temperature: 0.2, top_p: 0.9, top_k: 40, min_p: 0.05, repeat_penalty: 1.05}
        # Arm C — seat sampling with thinking pinned off.
        - model: Laguna-XS-2.1-4bit
          label: seat-nothink
          think: false
