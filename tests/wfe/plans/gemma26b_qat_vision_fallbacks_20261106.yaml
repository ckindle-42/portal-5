# Vision persona fallback lists: plain gemma4:26b-a4b-it-q4_K_M (what six personas list) vs the vision-group QAT tag
# qat-ctx8k (already on four personas). Only vision-group tags serve images; ctx32k tags are rerouted to auto-vision.
repeats: 4
workloads:
  auto-vision:
    tool_mode: production
    home: vision_production
    discovery: []
    arms:
      incumbent:
        model: gemma4:26b-a4b-it-q4_K_M
        label: seat-sampling
        sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0, repeat_penalty: 1.0}
      challengers:
        - model: gemma4:26b-a4b-it-qat-ctx8k
          label: seat-sampling
          sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0, repeat_penalty: 1.0}
