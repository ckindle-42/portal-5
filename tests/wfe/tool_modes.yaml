# Production tool mode per workspace (root-fix Part 2a; tests/wfe/eval_mode.py).
# A listed workspace runs its OWN tools through the pipeline under an evaluation scope:
# the pipeline offers and authorizes only `allow`, and each MCP confines the call to the
# row's namespace. Unlisted workspaces keep the harness's sandbox tools. Changing this
# file changes the instrument: running campaigns refuse it as drift.
workspaces:
  auto-documents:
    tool_mode: production
    allow: [create_word_document, create_excel, create_powerpoint, read_word_document,
            read_excel, read_powerpoint, read_pdf]
  auto-research::data:
    tool_mode: production
    allow: [attach_source, run_sql, profile_table, list_session, create_excel, execute_python]
  auto-research:
    # web_search is included for the real-use suite; web_fetch and news_search remain deferred.
    tool_mode: production
    allow: [kb_search, kb_search_all, kb_list, recall, graph_recall, neighbors, entity_timeline, remember, web_search]
  auto-compliance:
    # Served by the compliance EVALUATION instance (root-fix Part 2c-2), never the operator's
    # store: the workspace's tools that were measured read-only, model-free and
    # history-independent (eval_instance.VERIFIED_TOOLS). Writes, model-backed tools and live
    # feeds (CVE/EPSS/KEV/advisories, web) are excluded; the feeds are Part 2c-3's.
    tool_mode: production
    allow: [compliance_answers, compliance_coverage, compliance_flexibility, compliance_intentionality, compliance_links, compliance_mappings, compliance_notes, compliance_orphans, compliance_read, compliance_requirement, compliance_route, compliance_search, compliance_timeline, compliance_trace, lookup_control, map_frameworks, nerc_cip_currency, nerc_cip_requirement, patch_evidence, search_controls]
  auto-daily::fast:
    # Includes web_search for the real-use forecast task; web_fetch and other tools stay out.
    tool_mode: production
    allow: [kb_search, kb_list, read_pdf, read_word_document, read_excel, create_word_document, create_excel, create_powerpoint, execute_python, remember, recall, web_search]
  auto-daily::deep: &general_tools
    tool_mode: production
    allow: [kb_search, kb_list, read_pdf, read_word_document, read_excel, create_word_document, create_excel, create_powerpoint, execute_python, remember, recall]
  auto-daily: *general_tools
  auto-general-uncensored: &uncensored_tools
    # The uncensored general lanes carry no KB or document-create tools; they are measured
    # on the computed and memory kinds only (general_core_production).
    tool_mode: production
    allow: [execute_python, remember, recall]
  auto-general-uncensored::throwaway: *uncensored_tools
  tools-specialist: &tools_specialist_tools
    # The lane's own three tools (O2 §5): python for the compute and chain kinds,
    # memory for the store-recall and chain kinds — the same set the uncensored
    # general lanes run. Nothing else is offered or measured.
    tool_mode: production
    allow: [execute_python, remember, recall]
  # The fast variant runs the same suite, so it gets the same three tools: the
  # store-recall and chain kinds need remember/recall, which sandbox mode cannot
  # offer. Memory is served by the memory MCP under the row's eval scope, seeded
  # from the task's memory_seed (tests/wfe/eval_mode.py), as in every memory suite.
  tools-specialist::fast: *tools_specialist_tools
  auto-compliance::reading:
    # The reading subset (O2 §7, narrow): read-side corpus and register tools only —
    # every entry is in the workspace's own tools list AND in the evaluation
    # instance's VERIFIED_TOOLS (eval_instance.py). The writes and review decisions
    # (compliance_note, compliance_correct, compliance_review_*) are not offered and
    # not measured. Served by the compliance EVALUATION instance, never the
    # operator's store (root-fix Part 2c-2).
    tool_mode: production
    allow: [compliance_answers, compliance_coverage, compliance_links, compliance_notes, compliance_read, compliance_requirement, compliance_search, compliance_timeline, nerc_cip_currency, nerc_cip_requirement]
  auto-coding::cad:
    # The workspace's own CAD surface: the six cad_* pipeline tools (b123d_bridge.py
    # TOOL_NAMES) the suite measures, scoped to the row. The sandbox, web and memory
    # tools stay out: a python computation is not a measured part, and the schemas
    # cost P-4 window (O2: 20 tools vs 32k). find_holes has no checker — its engine
    # output shape is unverified (backlog) — it is offered because it is the natural
    # tool for the plate-holes kind.
    tool_mode: production
    allow: [cad_build, cad_execute, cad_measure, cad_find_holes, cad_render, cad_finalize]
  auto-audio:
    # The workspace's own transcription tools (portal-mlx-transcribe :8924), scoped to the row:
    # the fixture WAV is staged in the run's in/ and the transcripts land in out/ with receipts
    # (scripts/mlx-transcribe.py honours the eval scope). Needs the native service restarted
    # on a build with that change.
    tool_mode: production
    allow: [transcribe_audio, transcribe_with_speakers]
  auto-coding:
    tool_mode: production
    allow: [execute_python]
  auto-coding::fast-repair:
    tool_mode: production
    allow: [execute_python, execute_bash, read_pdf]
  auto-security:
    tool_mode: production
    allow: [execute_python]
  auto-security::blueteam:
    tool_mode: production
    allow: [validate_sigma]
  auto-spl:
    tool_mode: production
    allow: [convert_sigma, spl_validate_syntax, compile_yara]
  auto-vision:
    tool_mode: production
    allow: [generate_image, edit_image]
