# Production tool mode per workspace (root-fix Part 2a; tests/wfe/eval_mode.py).
# A listed workspace runs its OWN tools through the pipeline under an evaluation scope:
# the pipeline offers and authorizes only `allow`, and each MCP confines the call to the
# row's namespace. Unlisted workspaces keep the harness's sandbox tools. Changing this
# file changes the instrument: running campaigns refuse it as drift.
workspaces:
  auto-documents:
    tool_mode: production
    allow: [create_word_document, create_excel, create_powerpoint, read_word_document,
            read_excel, read_powerpoint, read_pdf]
  auto-data:
    tool_mode: production
    allow: [attach_source, run_sql, profile_table, list_session, create_excel]
  auto-research:
    # The knowledge base and memory, scoped to the row. Live web (web_search, web_fetch,
    # news_search) is a named deferral: results that depend on the live internet are not
    # repeatable. remember is a write, but under a scope it lands in the row's own memory.
    tool_mode: production
    allow: [kb_search, kb_search_all, kb_list, recall, graph_recall, neighbors, entity_timeline, remember]
  auto-compliance:
    # Served by the compliance EVALUATION instance (root-fix Part 2c-2), never the operator's
    # store: the workspace's tools that were measured read-only, model-free and
    # history-independent (eval_instance.VERIFIED_TOOLS). Writes, model-backed tools and live
    # feeds (CVE/EPSS/KEV/advisories, web) are excluded; the feeds are Part 2c-3's.
    tool_mode: production
    allow: [compliance_answers, compliance_coverage, compliance_flexibility, compliance_intentionality, compliance_links, compliance_mappings, compliance_notes, compliance_orphans, compliance_read, compliance_requirement, compliance_route, compliance_search, compliance_timeline, compliance_trace, lookup_control, map_frameworks, nerc_cip_currency, nerc_cip_requirement, patch_evidence, search_controls]
  general-fast: &general_tools
    # The general family's own tools, scoped to the row (TASK_WFE_SLICE_GENERAL): documents,
    # KB, python and memory. Excluded: web_search / web_fetch (no fixed gold), minimax_* and
    # transcribe_audio (out of scope). remember is a write that lands in the row's own memory.
    tool_mode: production
    allow: [kb_search, kb_list, read_pdf, read_word_document, read_excel, create_word_document, create_excel, create_powerpoint, execute_python, remember, recall]
  general-deep: *general_tools
  auto-daily: *general_tools
  auto-general-uncensored: &uncensored_tools
    # The uncensored general lanes carry no KB or document-create tools; they are measured
    # on the computed and memory kinds only (general_core_production).
    tool_mode: production
    allow: [execute_python, remember, recall]
  auto-uncensored-throwaway: *uncensored_tools
  tools-specialist:
    # The lane's own three tools (O2 §5): python for the compute and chain kinds,
    # memory for the store-recall and chain kinds — the same set the uncensored
    # general lanes run. Nothing else is offered or measured.
    tool_mode: production
    allow: [execute_python, remember, recall]
  auto-cad:
    # The workspace's own CAD surface: the six cad_* pipeline tools (b123d_bridge.py
    # TOOL_NAMES) the suite measures, scoped to the row. The sandbox, web and memory
    # tools stay out: a python computation is not a measured part, and the schemas
    # cost P-4 window (O2: 20 tools vs 32k). find_holes has no checker — its engine
    # output shape is unverified (backlog) — it is offered because it is the natural
    # tool for the plate-holes kind.
    tool_mode: production
    allow: [cad_build, cad_execute, cad_measure, cad_find_holes, cad_render, cad_finalize]
