# Production-faithful engine eval.
status: APPROVED
approved_by: operator
approved_on: 2026-11-13
binding:
  decisions:
    - coding-seat engine
    - MLX engine for the resident Gemma QAT seats and the daily MoE seat
  incumbent: oMLX
  pass: >-
    instrument-valid, quality not worse than the incumbent on the registered
    quality_gate task, speed faster than that cell's noise floor, and
    co-resident with the task-router plus two seats without the swap gate
    (growth 2048 MB, absolute used 4096 MB). Otherwise Unproven — keep the incumbent.
  ollama_gguf: failover and different bytes; it does not decide the MLX engine
template_parity:
  # Operator rule 2026-11-14. The two legs decode on their own kernels, so a greedy
  # divergence past the matched prefix is recorded drift, never a failure.
  set_by: operator
  set_on: "2026-11-14"
  prompt_token_tolerance: 0.02
  prefix_tokens: 0
  basis: >-
    From the 8e6410a9 canary for mlx-serve:plain:daily-moe. Rendered prompt counts
    3719 (mlx-serve) vs 3687 (oMLX): a 32-token delta inside the 74-token tolerance, so
    the template agrees. The two outputs share zero leading text tokens — mlx-serve
    returns no content because it forces the tool-call opener at 8 generated tokens
    while oMLX stays greedy and emits "OK" before the same get_weather call — so the
    largest prefix the live pair supports is 0. A stricter prefix would fail that pair
    on tool_choice enforcement, which is not a template or BOS question.
workloads:
  - id: quality-seat
    kind: quality_gate
    pass: the registered WFE task is not worse than the incumbent arm
    plans:
      - tests/wfe/plans/engine_h2h_202611_nemotron.yaml
      - tests/wfe/plans/engine_h2h_202611_qwen38.yaml
      - tests/wfe/plans/engine_h2h_202611_gemma_qat.yaml
    seats:
      - bench-engine-daily-moe
      - bench-engine-coding
      - bench-engine-hunt
      - bench-engine-council-json
  - id: tool-turn
    kind: tool
    pass: a tool call and the post-tool turn both complete through the pipeline
    note: >-
      Two turns through the Pipeline: a forced get_weather call, then the same
      conversation with the assistant's call, the tool result ("18C and clear.") and a
      follow-up question under tool_choice auto. Pass is the call being made and the
      post-tool answer using the result ("18"), both on the pinned route. This replaces
      the 11-13 preflight note that read a single turn as REVIEW: the workload now
      supplies the tool result the answer has to use.
    seats:
      - bench-engine-daily-moe
      - bench-engine-coding
  - id: concurrency-mix
    kind: concurrency
    pass: >-
      hunt JSON batch at 8 to 12, plus 2 chats, plus task-router calls, all in
      one window, every request on the intended engine and model
    seats:
      - bench-engine-hunt
      - bench-engine-daily-moe
      - bench-engine-task-router
  - id: long-context
    kind: long_context
    pass: the engine log reads back the launched context, and the needle is in the answer
    windows:
      - {seat: bench-engine-daily-moe, context_tokens: 32768}
      - {seat: bench-engine-coding, context_tokens: 98304}
      - {seat: bench-engine-council-json, context_tokens: 32768}
    note: >-
      Daily production context_limit is 16384. The 32768 cell is the long-context
      cell, not the seat's everyday window. 128k is the Gemma QAT tag ceiling
      (gemma4 ctx128k) and is a separate launch from the 8192 hunt window.
  - id: co-residence
    kind: co_residence
    pass: >-
      task-router plus two seats load concurrently as separate managed engine
      processes on their fixed ports beside the running stack; every route is
      correct and the swap gate stays closed
    negative: cannot co-reside beside the stack is a recorded result, not a dropped engine
    seats:
      - bench-engine-task-router
      - bench-engine-daily-moe
      - bench-engine-hunt
  - id: soak
    kind: stability
    duration_min: 45
    pass: >-
      the engine-specific resident reading (MLX phys_footprint or reported
      resident bytes; llama.cpp process-tree RSS) and independent vm_stat wired
      pages at minute 45 are each within 2 GB of the minute-5 plateau
    why: >-
      A leak of about 1 GB per 10 minutes clears the 2 GB tolerance between the
      minute-5 plateau and minute-45 sample. RSS remains diagnostic for MLX;
      the 11-13 screen was single bursts.
report: per engine, per seat, after the instrument marks the cell valid
lifecycle: >-
  Start and stop stay in tests/benchmarks/engine_h2h.yaml. The orchestrator runs
  them. 64 GB argv is the argv already in that file. Source URLs are that file's
  comments and were not re-verified against vendor docs.
