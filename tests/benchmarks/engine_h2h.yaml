# Engine × model head-to-head registry — read by tests/benchmarks/bench_engine_h2h.py.
# Governing doc: docs/MIMO_V26_DISTILL_9B_BRINGUP_V1.md ("Head-to-head test plan V2").
#
# Every launch command below was smoke-tested on this host 2026-09-23 against
# VulnLLM-R-7B-4bit: server up, served id, chat "OK", clean get_weather tool call,
# clean shutdown. The spec (speculative-decoding) rows were NOT load-tested — that
# is the run's own preflight, and "engine unsupported" is a valid result for them.
#
# Placeholders rendered by the harness: {mlx_root} {model_dir} {served} {port}
# {ctx} {tool_parser} {reasoning_parser} {drafter_path} {draft_path} {gguf_path}
# {draft_gguf_path} {spec_args} {splash_model} {splash_extra} {llama_server}
# {mlx_server_script} {python}

mlx_root: /Volumes/data01/omlx-models
# Drafters / draft models stay OUTSIDE mlx_root: oMLX lists any dir with a
# model config as a servable model, and a drafter dir carries one.
drafter_root: /Volumes/data01/engine_h2h_drafters
# MTPLX packs (MLX weights + mtp.safetensors + mtplx_runtime.json) stay OUTSIDE
# mlx_root for the same reason: oMLX would list them as servable models. On the
# internal SSD because data01 is 99% full; that moves cold-load time, not decode.
mtplx_root: ~/mtplx-models

guard:
  sample_s: 30
  # Rule 4: a run whose swap grows more than this is INVALID, not reported.
  max_swap_growth_mb: 2048
  # Rule 3: refuse to START a run with more than this already swapped out. An
  # absolute amount, not a fraction: macOS sizes the swap total to fit usage.
  max_start_swap_used_mb: 4096

engines:
  ollama:
    kind: external
    requires: ollama
    base: http://127.0.0.1:11434
  omlx:
    kind: external
    requires: mlx
    base: http://127.0.0.1:8085
    # oMLX's admin API needs an API key this host deliberately doesn't set (it
    # would also gate the /v1 path the pipeline uses), so per-model spec settings
    # are applied by editing this file (backed up first) and restarting the
    # launchd service. Discovery of a new model dir also needs the restart.
    settings_file: ~/.omlx/model_settings.json
    restart: [launchctl, kickstart, -k, "gui/{uid}/com.portal5.omlx"]
    process_name: omlx-server
  mlx-serve:
    kind: managed
    requires: mlx
    port: 11234
    version: "26.11.2"
    # brew tap ddalcu/mlx-serve https://github.com/ddalcu/mlx-serve && brew trust ddalcu/mlx-serve && brew install mlx-serve
    # CLI formula, arm64. Not the cask. mlx-serve --version must print 26.11.2.
    # Drafter flags are unchanged from 26.9.2: plain is --no-pld --no-drafter --no-mtp.
    # PLD (prompt-lookup speculation) is ON by default in mlx-serve, and it
    # auto-loads an MTP head or a drafter/ subdir it finds — plain must turn all three off.
    plain: [mlx-serve, --serve, --model, "{mlx_root}/{model_dir}", --host, 127.0.0.1, --port, "{port}", --ctx-size, "{ctx}", --no-pld, --no-drafter, --no-mtp]
    base_spec: [mlx-serve, --serve, --model, "{mlx_root}/{model_dir}", --host, 127.0.0.1, --port, "{port}", --ctx-size, "{ctx}"]
    stop_signal: INT
  rapid-mlx:
    kind: managed
    requires: mlx
    port: 11235
    version: "1.0.2"
    # Install: curl -fsSL https://rapidmlx.com/install.sh | bash
    # Bundles Python 3.12. Do not install into the portal 3.10 venv. arm64 host.
    # 1.0 keeps --speculative-config (dflash/mtp/suffix). --no-telemetry stays on.
    # Do not pass --disable-disk-caches: the default was not verified here.
    plain: [rapid-mlx, --no-telemetry, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --host, 127.0.0.1, --port, "{port}", --no-spec-decode, --enable-auto-tool-choice, --tool-call-parser, "{tool_parser}"]
    base_spec: [rapid-mlx, --no-telemetry, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --host, 127.0.0.1, --port, "{port}", --enable-auto-tool-choice, --tool-call-parser, "{tool_parser}"]
    stop_signal: INT
  vllm-mlx:
    kind: managed
    requires: mlx
    port: 11236
    version: "0.6.0"
    # uvx --from vllm-mlx==0.6.0 vllm-mlx --version
    # Rapid-MLX ships its own vllm-mlx executable; this pin keeps upstream distinct.
    # Apple Silicon only. --continuous-batching is off by default in 0.6.0 and is
    # what makes n>1 a batch. It changes the 0.5.0 single-user default on purpose.
    # No --ssd-cache-dir. No --use-paged-cache.
    plain: [uvx, --from, vllm-mlx==0.6.0, vllm-mlx, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --host, 127.0.0.1, --port, "{port}", --enable-auto-tool-choice, --tool-call-parser, "{tool_parser}", --continuous-batching, --default-chat-template-kwargs, '{"enable_thinking": false}']
    base_spec: [uvx, --from, vllm-mlx==0.6.0, vllm-mlx, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --host, 127.0.0.1, --port, "{port}", --enable-auto-tool-choice, --tool-call-parser, "{tool_parser}", --continuous-batching, --default-chat-template-kwargs, '{"enable_thinking": false}']
    stop_signal: INT
  mlx_lm.server:
    kind: managed
    requires: mlx
    port: 11237
    # Reference baseline only. Its /v1/models lists the whole HF cache and the
    # request `model` must be the --model path, so it is launched from mlx_root
    # with a RELATIVE path: the id then equals the served name every engine uses.
    cwd: "{mlx_root}"
    plain: [mlx_lm.server, --model, "{model_dir}", --host, 127.0.0.1, --port, "{port}"]
    base_spec: [mlx_lm.server, --model, "{model_dir}", --host, 127.0.0.1, --port, "{port}"]
    # Measured: mlx_lm.server ignores SIGINT.
    stop_signal: TERM
    list_models_is_cache: true
  prismml-llama:
    kind: managed
    requires: gguf
    port: 11238
    server_path: ~/src/prismml-llama.cpp/build/bin/llama-server
    plain: ["{llama_server}", -m, "{gguf_path}", -ngl, "99", -c, "{ctx}", --jinja, --alias, "{served}", --host, 127.0.0.1, --port, "{port}"]
    base_spec: ["{llama_server}", -m, "{gguf_path}", -ngl, "99", -c, "{ctx}", --jinja, --alias, "{served}", --host, 127.0.0.1, --port, "{port}", "{spec_args}"]
    stop_signal: INT
  brew-llama:
    kind: managed
    requires: gguf
    port: 11240
    server_path: /opt/homebrew/bin/llama-server
    plain: ["{llama_server}", -m, "{gguf_path}", -ngl, "99", -c, "{ctx}", --jinja, --alias, "{served}", --host, 127.0.0.1, --port, "{port}"]
    base_spec: ["{llama_server}", -m, "{gguf_path}", -ngl, "99", -c, "{ctx}", --jinja, --alias, "{served}", --host, 127.0.0.1, --port, "{port}", "{spec_args}"]
    stop_signal: INT
  prismml-mlx:
    kind: managed
    requires: prismml_mlx
    port: 11239
    server_script: tests/benchmarks/prismml_mlx_server.py
    plain: ["{python}", "{mlx_server_script}", --model-dir, "{mlx_root}/{model_dir}", --host, 127.0.0.1, --port, "{port}", --ctx, "{ctx}"]
    base_spec: ["{python}", "{mlx_server_script}", --model-dir, "{mlx_root}/{model_dir}", --host, 127.0.0.1, --port, "{port}", --ctx, "{ctx}", "{spec_args}"]
    stop_signal: INT
  mtplx:
    kind: managed
    requires: mtplx
    port: 11241
    root: mtplx_root
    # MTPLX 2.12.0 (uv tool install mtplx). Native-MTP only: it drafts with the
    # model's own mtp head from a Youssofal pack, never an external drafter or PLD.
    # Plain = --no-mtp (target-only AR in the same loaded runtime). Fairness pins:
    # --no-stats-footer (else a TPS footer is appended to every reply), SSD session
    # cache off (a disk tier no other engine gets), --profile sustained (the default
    # resolves to Turbo for the 27B/9B packs; sustained matches MTP_BENCH_20260528).
    # --tool-prompt-mode native: the default is `hybrid`, MTPLX's legacy tool
    # contract, so tool calls/results were not rendered by the model's own chat
    # template (visible as tool_prompt_mode in the per-request mtplx_stats).
    plain: [mtplx, serve, --model, "{model_root}/{model_dir}", --model-id, "{served}", --host, 127.0.0.1, --port, "{port}", --no-auth, --yes, --context-window, "{ctx}", --profile, sustained, --no-stats-footer, --ssd-session-cache, "off", --tool-prompt-mode, native, --no-mtp]
    base_spec: [mtplx, serve, --model, "{model_root}/{model_dir}", --model-id, "{served}", --host, 127.0.0.1, --port, "{port}", --no-auth, --yes, --context-window, "{ctx}", --profile, sustained, --no-stats-footer, --ssd-session-cache, "off", --tool-prompt-mode, native, "{spec_args}"]
    stop_signal: INT
  splash:
    kind: managed
    requires: splash
    port: 11242
    version: "1.6.1"
    # brew install incoai/tap/splash
    # CLI formula, arm64 bottle. Not the splash-app cask. splash --version must print 1.6.1.
    # 1.6.1 changes INT8 activations by default on M5 and later, so a 1.5.0 vs 1.6.1
    # quality compare is not the same graph (docs/ENGINE_LANDSCAPE_20261111.md).
    # No draft-off flag: plain and spec are both DFlash2. {splash_extra} is the
    # model tail (model-dir, local draft, served name, reasoning). --max-cache-disk 0
    # keeps Splash's SSD KV tier off. Do not pass --persistent-cache.
    plain: [splash, serve, --model, "{splash_model}", --host, 127.0.0.1, --port, "{port}", --max-context, "{ctx}", --max-cache-disk, "0", --language-only, "{splash_extra}"]
    base_spec: [splash, serve, --model, "{splash_model}", --host, 127.0.0.1, --port, "{port}", --max-context, "{ctx}", --max-cache-disk, "0", --language-only, "{splash_extra}"]
    stop_signal: INT
  mlxcel:
    kind: managed
    requires: mlx
    port: 11243
    version: "0.8.1"
    # Pin https://github.com/lablup/mlxcel/releases/download/v0.8.1/mlxcel-macos-aarch64.zip
    # sha256 56c57d3ba56f78d8fa7afaf07d6d7c0b06292364731ee6d327ae30e5fa685560
    # file(1) must be Mach-O arm64. brew tap lablup/tap && brew install lablup/tap/mlxcel
    # only when mlxcel --version prints 0.8.1. Refuse linux cuda zips and rocm/cuda builds.
    # Explicit --parallel 4 splits the ctx unless --kv-unified is also set.
    # --prompt-lookup stays off. No disk KV flag.
    plain: [mlxcel, serve, -m, "{mlx_root}/{model_dir}", --alias, "{served}", --host, 127.0.0.1, --port, "{port}", --ctx-size, "{ctx}", --parallel, "4", --kv-unified]
    base_spec: [mlxcel, serve, -m, "{mlx_root}/{model_dir}", --alias, "{served}", --host, 127.0.0.1, --port, "{port}", --ctx-size, "{ctx}", --parallel, "4", --kv-unified]
    stop_signal: INT
  vllm-metal:
    kind: managed
    requires: mlx
    port: 11244
    version: "0.33.0"
    # brew tap vllm-project/vllm-metal https://github.com/vllm-project/vllm-metal
    # brew install vllm-project/vllm-metal/vllm-metal
    # Stable channel is the 2026-11-04 release; the dev install script tracks main, do not use it.
    # macOS 15+, arm64, formula Python 3.12. Refuse an x86_64 wheel. pip install vllm-metal is unsupported.
    # --host/--port are upstream vLLM CLI, not printed on the 2026-09-22 Metal blog: confirm
    # with `vllm serve --help` first. No SSD-cache flag exists there; do not add one.
    # --gpu-memory-utilization 0.7 is the blog's 64 GB example for Qwen3.8-27B-4bit.
    # No --tool-call-parser until --help on this install lists it.
    # Think-off: the blog shows no think flag, so preflight must show whether
    # chat_template_kwargs.enable_thinking is honoured; if it is not, the cell is REVIEW.
    # The doc prints {spec_json} here; the harness splices a per-model spec args list instead,
    # so a cell renders as `--no-async-scheduling --speculative-config <json>`. No seat has a
    # method until docs/supported_models.md on v0.33.0 is read at bench time.
    # The doc gives no --served-model-name, so vLLM serves the model path rather than {served}:
    # preflight `listed` is expected False until that flag is confirmed on this install.
    # stop_signal is unstated in the doc; the harness default INT applies.
    # 2026-11-13: 0.7 (the blog's 64 GB example) pushed swap to 7.4 GB beside the running stack and
    # tripped rule 3; 0.45 (~29 GB) holds every seat here plus KV. --served-model-name so the
    # request id matches (without it vLLM serves the path → 404). --trust-remote-code for the
    # Qwen3.8 processor.
    plain: [vllm, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --trust-remote-code, --host, 127.0.0.1, --port, "{port}", --gpu-memory-utilization, "0.45", --max-model-len, "{ctx}"]
    base_spec: [vllm, serve, "{mlx_root}/{model_dir}", --served-model-name, "{served}", --trust-remote-code, --host, 127.0.0.1, --port, "{port}", --gpu-memory-utilization, "0.45", --max-model-len, "{ctx}", --no-async-scheduling, --speculative-config, "{spec_args}"]

models:
  mimo:
    source_repo: XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B
    ollama: portal5/mimo-v26-distill-9b:q4_K_M-ctx256k
    mlx: MiMo-V2.6-Distill-Qwen-9B-MLX-4bit            # nativ-community build, shared by every MLX engine
    mtplx: MiMo-V2.6-Qwen-9B-MTPLX-Optimized-Speed     # Youssofal/…, base XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B
    ctx: 262144
    prefill_tokens: 20000
    # <tool_call><function=NAME><parameter=K>V</parameter></function></tool_call>
    # (bring-up doc, template section) is the qwen3-coder XML format.
    tool_parser: qwen3_coder
    spec:
      # ddalcu (mlx-serve author) build ships model-mtp.safetensors — Qwen3.5's native MTP head.
      mlx-serve: {method: mtp, model_dir: MiMo-V2.6-Distill-Qwen-9B-MLX-Serve-4bit-mtp, args: []}
      rapid-mlx: {method: mtp, model_dir: MiMo-V2.6-Distill-Qwen-9B-MLX-Serve-4bit-mtp, args: [--speculative-config, '{"method":"mtp","num_speculative_tokens":3}']}
      vllm-mlx: {method: mtp, model_dir: MiMo-V2.6-Distill-Qwen-9B-MLX-Serve-4bit-mtp, args: [--enable-mtp]}
      omlx: {method: mtp, model_dir: MiMo-V2.6-Distill-Qwen-9B-MLX-Serve-4bit-mtp, settings: {mtp_enabled: true}}
      mtplx: {method: mtp, args: [--mtp]}
      mlx_lm.server: null
  laguna:
    source_repo: poolside/Laguna-XS.2
    ollama: portal5/laguna-xs2:q4_K_M-ctx128k
    mlx: Laguna-XS.2-4bit
    ctx: 131072
    prefill_tokens: 20000
    tool_parser: {vllm-mlx: poolside_v1, rapid-mlx: auto, default: auto}
    # Poolside's drafter is in `speculators` format (aux_hidden_state_layer_ids,
    # draft_vocab_size 32000) — NOT the z-lab DFlash layout (dflash_config.
    # target_layer_ids) the MLX engines auto-detect. Expect load failures; a
    # success here is the single biggest possible agentic-lane win.
    drafter: poolside/Laguna-XS.2-speculator.dflash
    spec:
      mlx-serve: {method: dflash, args: [--drafter, "{drafter_path}"]}
      rapid-mlx: {method: dflash, args: [--speculative-config, '{"method":"dflash","model":"{drafter_path}"}']}
      omlx: {method: dflash, settings: {dflash_enabled: true, dflash_draft_model: "{drafter_path}", dflash_max_ctx: 131072}}
      vllm-mlx: null
      mlx_lm.server: null
  vulnllm:
    source_repo: UCSB-SURFI/VulnLLM-R-7B                # base_model per the MLX build's README
    ollama: hf.co/mradermacher/VulnLLM-R-7B-GGUF:q4_K_M-ctx8k
    mlx: VulnLLM-R-7B-4bit
    ctx: 8192
    prefill_tokens: 6000                                 # must fit the 8k window with room to answer
    tool_parser: hermes
    # Qwen2.5-7B base: a 0.5B Qwen2.5 shares the tokenizer — classic draft-model speculation.
    draft_model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    spec:
      mlx_lm.server: {method: draft, args: [--draft-model, "{draft_path}", --num-draft-tokens, "4"]}
      mlx-serve: {method: pld, args: []}                 # PLD is its built-in, model-agnostic path
      rapid-mlx: {method: suffix, args: [--speculative-config, '{"method":"suffix","num_speculative_tokens":8}']}
      vllm-mlx: null
      omlx: null
  # Bonsai family probe. GGUF weights resolve only from the Hugging Face cache;
  # PrismML MLX packs are materialized beneath mlx_root by `hf download`.
  bonsai_v1_7b:
    base_repo: prism-ml/Bonsai-1.7B-unpacked
    gguf: {repo: prism-ml/Bonsai-1.7B-gguf, file: Bonsai-1.7B-Q1_0.gguf}
    source_repo: prism-ml/Bonsai-1.7B-gguf
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    thinking_sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    ollama: bonsai-probe:bonsai-v1-1.7b
    control: qwen3_1_7b_q4
  bonsai_v1_4b:
    base_repo: prism-ml/Bonsai-4B-unpacked
    gguf: {repo: prism-ml/Bonsai-4B-gguf, file: Bonsai-4B-Q1_0.gguf}
    source_repo: prism-ml/Bonsai-4B-gguf
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    thinking_sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    ollama: bonsai-probe:bonsai-v1-4b
    control: qwen3_4b_q4
  bonsai_v1_8b:
    base_repo: prism-ml/Bonsai-8B-unpacked
    gguf: {repo: prism-ml/Bonsai-8B-gguf, file: Bonsai-8B-Q1_0.gguf}
    source_repo: prism-ml/Bonsai-8B-gguf
    mlx: Bonsai-8B-mlx-1bit
    prismml_mlx: Bonsai-8B-mlx-1bit
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    thinking_sampling: {temperature: 0.5, top_p: 0.9, top_k: 20}
    ollama: bonsai-probe:bonsai-v1-8b
    control: qwen3_8b_q4
  bonsai_v1_27b:
    base_repo: Qwen/Qwen3.6-27B
    gguf: {repo: prism-ml/Bonsai-27B-gguf, file: Bonsai-27B-Q1_0.gguf}
    source_repo: prism-ml/Bonsai-27B-gguf
    mlx: Bonsai-27B-mlx-1bit
    prismml_mlx: Bonsai-27B-mlx-1bit
    # Binary MLX needs the PrismML 1-bit core, separate from the stock 0.32 vision runtime.
    prismml_mlx_python: ~/src/prismml-mlx/.venv-bonsai/bin/python
    ctx: 32768
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.7, top_p: 0.95, top_k: 20}
    thinking_sampling: {temperature: 0.7, top_p: 0.95, top_k: 20}
    ollama: bonsai-probe:bonsai-v1-27b
    control: qwen36_27b_q4
    draft_gguf: {repo: prism-ml/Bonsai-27B-gguf, file: Bonsai-27B-dspark-Q4_1.gguf}
    draft_gguf_override: ~/.cache/hf-bonsai/converted/Bonsai-27B-dspark-Q4_1-dflash.gguf
    spec:
      prismml-llama: {method: draft-dspark, args: [-md, "{draft_gguf_path}", --spec-type, draft-dspark, --spec-draft-n-max, "4", -ngld, "999", -np, "1"]}
  ternary_v1_1_7b:
    base_repo: prism-ml/Ternary-Bonsai-1.7B-unpacked
    gguf: {repo: prism-ml/Ternary-Bonsai-1.7B-gguf, file: Ternary-Bonsai-1.7B-PQ2_0.gguf}
    source_repo: prism-ml/Ternary-Bonsai-1.7B-gguf
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    thinking_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    ollama: bonsai-probe:ternary-v1-1.7b
    control: qwen3_1_7b_q4
  ternary_v1_4b:
    base_repo: prism-ml/Ternary-Bonsai-4B-unpacked
    gguf: {repo: prism-ml/Ternary-Bonsai-4B-gguf, file: Ternary-Bonsai-4B-PQ2_0.gguf}
    source_repo: prism-ml/Ternary-Bonsai-4B-gguf
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    thinking_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    ollama: bonsai-probe:ternary-v1-4b
    control: qwen3_4b_q4
  ternary_v1_8b:
    base_repo: prism-ml/Ternary-Bonsai-8B-unpacked
    gguf: {repo: prism-ml/Ternary-Bonsai-8B-gguf, file: Ternary-Bonsai-8B-PQ2_0.gguf}
    source_repo: prism-ml/Ternary-Bonsai-8B-gguf
    mlx: Ternary-Bonsai-8B-mlx-2bit
    prismml_mlx: Ternary-Bonsai-8B-mlx-2bit
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    thinking_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    ollama: bonsai-probe:ternary-v1-8b
    control: qwen3_8b_q4
  ternary_v1_8b_q2:
    base_repo: prism-ml/Ternary-Bonsai-8B-unpacked
    gguf: {repo: prism-ml/Ternary-Bonsai-8B-gguf, file: Ternary-Bonsai-8B-Q2_0_g64.gguf}
    source_repo: prism-ml/Ternary-Bonsai-8B-gguf
    ctx: 16384
    prefill_tokens: 2048
    tool_parser: hermes
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
